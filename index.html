/* Runs before first paint: resolves the saved theme choice from a small
   mirror key, because the real progress store may load asynchronously. */
(function(){
  var t = 'light';
  try{
    var c = localStorage.getItem('hangeul-path-theme') || 'auto';
    if(c === 'dark') t = 'dark';
    else if(c === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
  }catch(e){ /* storage blocked; fall back to light */ }
  document.documentElement.setAttribute('data-theme', t);
  if(t === 'dark'){
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', '#0E1719');
  }
})();

<style>
/* ============================================================
   DESIGN TOKENS
   Palette drawn from Korean celadon pottery (청자) glaze tones,
   ink-wash black (먹), and traditional red seal-stamp ink (인주):
   not a generic template palette.

   Every colour below is a token. The dark theme at the bottom of
   this block re-states the same names, so components never need
   to know which theme is active.
   ============================================================ */
:root{
  color-scheme:light;

  /* --- surfaces & ink --- */
  --paper:#EDF2EE;
  --paper-2:#E3EBE5;
  --surface:#FFFFFF;
  --surface-2:#F4F8F5;
  --surface-3:#EAF1EC;
  --ink:#16262A;
  --ink-2:#243A3F;
  --ink-soft:#5B6E6A;
  --ink-faint:#8A9C97;

  /* --- accents --- */
  --celadon:#4C9186;
  --celadon-deep:#356F63;
  --celadon-bright:#5FA99C;
  --celadon-pale:#DCEBE4;
  --celadon-pale-2:#CFE4DB;
  --seal:#C3402C;
  --seal-deep:#9E3221;
  --seal-pale:#F5DAD3;
  --gold:#B08A3E;
  --gold-bright:#C9A353;
  --gold-pale:#F0E4C8;

  /* --- lines --- */
  --border:#D7E2DC;
  --border-soft:#E5EDE8;
  --border-strong:#C3D3CC;

  /* --- on-accent text (flips in dark so contrast survives) --- */
  --on-celadon:#FFFFFF;
  --on-seal:#FFFFFF;
  --on-ink:#FFFFFF;

  /* --- text over the dark hero panel --- */
  --hero-bg:#16262A;
  --hero-text:#FFFFFF;
  --hero-dim:#B9CBC6;
  --hero-faint:#9FB8B1;
  --hero-line:rgba(255,255,255,0.14);
  --hero-cell:rgba(255,255,255,0.055);
  --hero-chip:rgba(255,255,255,0.09);

  /* --- heatmap ramp --- */
  --hm-0:#E5EDE8;
  --hm-1:#CFE4DB;
  --hm-2:#9CC8BA;
  --hm-3:#4C9186;
  --hm-4:#2A5C52;

  /* --- elevation --- */
  --shadow-sm:0 1px 2px rgba(22,38,42,0.06), 0 1px 1px rgba(22,38,42,0.04);
  --shadow-md:0 4px 14px rgba(22,38,42,0.08), 0 2px 4px rgba(22,38,42,0.05);
  --shadow-lg:0 12px 32px rgba(22,38,42,0.14), 0 4px 10px rgba(22,38,42,0.06);
  --shadow-glow:0 0 0 4px rgba(76,145,134,0.16);
  --ring-glow:drop-shadow(0 0 6px rgba(76,145,134,0.45));

  /* --- geometry --- */
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --radius-full:999px;

  /* --- motion: one easing vocabulary, used everywhere --- */
  --ease:cubic-bezier(.2,0,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --t-fast:0.15s;
  --t-mid:0.25s;
  --t-slow:0.45s;

  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Noto Serif', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'SF Mono', 'SFMono-Regular', 'Roboto Mono', Menlo, Consolas, 'Courier New', monospace;
  --font-kr: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Nanum Gothic', sans-serif;
}

/* ------------------------------------------------------------
   DARK THEME
   Not an inversion: the paper becomes ink-wash, the celadon is
   lifted so it still reads as glaze rather than mud, and the
   seal red is warmed so it stays legible on a dark ground.
   Applied when the user picks dark, or picks auto (no
   data-theme attribute) and the OS asks for dark.
   ------------------------------------------------------------ */
html[data-theme="dark"]{
  color-scheme:dark;

  --paper:#0E1719;
  --paper-2:#0A1113;
  --surface:#162427;
  --surface-2:#1C2E31;
  --surface-3:#22373B;
  --ink:#E8F0EC;
  --ink-2:#F2F7F4;
  --ink-soft:#A3B8B3;
  --ink-faint:#7A908B;

  --celadon:#6DB5A6;
  --celadon-deep:#8ACCBC;
  --celadon-bright:#8ACCBC;
  --celadon-pale:#1E3A38;
  --celadon-pale-2:#254743;
  --seal:#E4715C;
  --seal-deep:#F0907D;
  --seal-pale:#3A211C;
  --gold:#D4AC63;
  --gold-bright:#E2C084;
  --gold-pale:#33291a;

  --border:#2A4247;
  --border-soft:#22373B;
  --border-strong:#375257;

  --on-celadon:#0B1618;
  --on-seal:#1A0C09;
  --on-ink:#0E1719;

  --hero-bg:#1B2F33;
  --hero-text:#F2F7F4;
  --hero-dim:#A9C3BD;
  --hero-faint:#8FA8A3;
  --hero-line:rgba(255,255,255,0.10);
  --hero-cell:rgba(255,255,255,0.045);
  --hero-chip:rgba(255,255,255,0.07);

  --hm-0:#1C2E31;
  --hm-1:#254743;
  --hm-2:#3A6D63;
  --hm-3:#5FA99C;
  --hm-4:#8ACCBC;

  --shadow-sm:0 1px 2px rgba(0,0,0,0.40), 0 1px 1px rgba(0,0,0,0.30);
  --shadow-md:0 4px 14px rgba(0,0,0,0.45), 0 2px 4px rgba(0,0,0,0.30);
  --shadow-lg:0 12px 32px rgba(0,0,0,0.55), 0 4px 10px rgba(0,0,0,0.35);
  --shadow-glow:0 0 0 4px rgba(109,181,166,0.20);
  --ring-glow:drop-shadow(0 0 8px rgba(109,181,166,0.55));
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  /* A very soft celadon wash so the paper reads as a surface with
     depth rather than a flat fill. Fixed, so it never scroll-jitters. */
  background:
    radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--celadon) 11%, transparent), transparent 62%),
    radial-gradient(900px 560px at 108% 4%, color-mix(in srgb, var(--gold) 8%, transparent), transparent 60%),
    var(--paper);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  transition:background-color var(--t-mid) var(--ease), color var(--t-mid) var(--ease);
}
h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; margin:0; color:var(--ink); }
p{ margin:0; }
button{ font-family:inherit; }
a{ color:inherit; }
.kr{ font-family:var(--font-kr); }
.mono{ font-family:var(--font-mono); letter-spacing:0.01em; }

/* ------------------------------------------------------------
   ICONS
   icon() emits <svg class="ic"> with a viewBox but no intrinsic
   size, so without this an icon expands to the SVG default box
   (up to ~670px). This is the single baseline; the contextual
   rules further down all come later in the sheet and so win on
   source order at equal specificity.
   ------------------------------------------------------------ */
svg.ic{
  width:18px; height:18px;
  flex-shrink:0;
  display:inline-block;
  vertical-align:-0.18em;
}
.btn svg.ic{ width:16px; height:16px; }
.btn-sm svg.ic{ width:14px; height:14px; }
h1 svg.ic, h2 svg.ic, h3 svg.ic{ vertical-align:-0.12em; }

::selection{ background:var(--celadon-pale-2); color:var(--ink); }

button:focus-visible, a:focus-visible, [tabindex]:focus-visible, input:focus-visible{
  outline:2.5px solid var(--celadon-deep);
  outline-offset:2px;
  border-radius:4px;
}

::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
::-webkit-scrollbar-thumb:hover{ background:var(--ink-faint); }

/* ============================================================
   APP SHELL
   ============================================================ */
#app{ min-height:100vh; display:flex; }

.sidebar{
  width:250px;
  flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border-soft);
  display:flex;
  flex-direction:column;
  padding:22px 16px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 22px; }
.brand-mark{
  width:38px;height:38px;border-radius:var(--radius-sm);
  background:var(--hero-bg);
  display:flex;align-items:center;justify-content:center;
  color:var(--hero-text); font-family:var(--font-kr); font-size:19px; font-weight:700;
  flex-shrink:0;
}
.brand-text h1{ font-size:16.5px; line-height:1.15; letter-spacing:-0.01em;}
.brand-text span{ font-size:11px; color:var(--ink-soft); letter-spacing:0.02em; }

.nav-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; flex:1; }
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:9px 12px; border-radius:var(--radius-sm);
  color:var(--ink-soft); font-size:14.5px; font-weight:500;
  cursor:pointer; border:none; background:none; width:100%; text-align:left;
  transition:background 0.15s ease, color 0.15s ease;
}
.nav-item svg{ width:18px; height:18px; flex-shrink:0; opacity:0.85; }
.nav-item:hover{ background:var(--surface-2); color:var(--ink); }
.nav-item.active{ background:var(--celadon-pale); color:var(--celadon-deep); font-weight:600; }
.nav-item.active svg{ opacity:1; }
.nav-group-label{
  font-size:10px; text-transform:uppercase; letter-spacing:0.09em; color:var(--ink-faint);
  font-weight:700; padding:14px 12px 5px; list-style:none;
}
.nav-list li:first-child.nav-group-label{ padding-top:2px; }

.sidebar-foot{
  margin-top:14px; padding:13px 12px; border-radius:var(--radius-md);
  background:var(--surface-2); border:1px solid var(--border-soft);
  display:flex; flex-direction:column; gap:9px;
}
.sidebar-stat-row{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color:var(--ink-soft);}
.sidebar-stat-row b{ color:var(--ink); font-weight:700; }
.mini-bar{ height:5px; border-radius:4px; background:var(--border-soft); overflow:hidden; }
.mini-bar > div{ height:100%; background:var(--celadon); border-radius:4px; transition:width 0.5s cubic-bezier(.4,0,.2,1); }

.topbar{ display:none; }

.main{ flex:1; min-width:0; }
.main-inner{ max-width:920px; margin:0 auto; padding:40px 36px 90px; }

.section-head{ margin-bottom:26px; }
.section-eyebrow{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.09em; color:var(--celadon-deep); font-weight:700; margin-bottom:6px; }
.section-title{ font-size:29px; letter-spacing:-0.01em; }
.section-desc{ margin-top:7px; color:var(--ink-soft); font-size:14.5px; line-height:1.55; max-width:62ch; }

/* ============================================================
   PRIMITIVES: buttons, cards, tags, progress
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:10px 18px; border-radius:var(--radius-sm); border:1px solid transparent;
  font-size:14px; font-weight:600; cursor:pointer; transition:all 0.15s ease;
  white-space:nowrap;
}
.btn-primary{ background:var(--ink); color:var(--surface); }
.btn-primary:hover{ background:var(--ink-2); transform:translateY(-1px); box-shadow:var(--shadow-sm); }
.btn-celadon{ background:var(--celadon); color:var(--on-celadon); }
.btn-celadon:hover{ background:var(--celadon-deep); transform:translateY(-1px); box-shadow:var(--shadow-sm); }
.btn-outline{ background:var(--surface); color:var(--ink); border-color:var(--border); }
.btn-outline:hover{ border-color:var(--ink-faint); background:var(--surface-2); }
.btn-seal{ background:var(--seal); color:var(--on-seal); }
.btn-seal:hover{ background:var(--seal-deep); }
.btn-ghost{ background:transparent; color:var(--ink-soft); border:none; }
.btn-ghost:hover{ color:var(--ink); background:var(--surface-2); }
.btn-sm{ padding:6px 12px; font-size:12.5px; border-radius:6px;}
.btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none !important; }
.btn-block{ width:100%; }

.card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
}
.card-pad{ padding:22px; }

.tag{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
  padding:3px 9px; border-radius:20px; letter-spacing:0.02em; text-transform:uppercase;
}
.tag-celadon{ background:var(--celadon-pale); color:var(--celadon-deep); }
.tag-gold{ background:var(--gold-pale); color:var(--gold); }
.tag-seal{ background:var(--seal-pale); color:var(--seal-deep); }
.tag-neutral{ background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--border-soft); }

.progress-track{ height:8px; border-radius:6px; background:var(--border-soft); overflow:hidden; }
.progress-fill{ height:100%; border-radius:6px; background:var(--celadon); transition:width 0.6s cubic-bezier(.4,0,.2,1); }
.progress-fill.seal{ background:var(--seal); }
.progress-fill.gold{ background:var(--gold); }

.grid{ display:grid; gap:14px; }
.grid-2{ grid-template-columns:repeat(2,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-5{ grid-template-columns:repeat(5,1fr); }
.grid-6{ grid-template-columns:repeat(6,1fr); }

.fade-in{ animation:fadeIn 0.35s cubic-bezier(.2,0,.2,1) both; }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
@keyframes popIn{ 0%{ transform:scale(0.85); opacity:0;} 70%{ transform:scale(1.04);} 100%{ transform:scale(1); opacity:1;} }
@keyframes flameFlicker{ 0%,100%{ transform:scale(1) rotate(0deg);} 50%{ transform:scale(1.08) rotate(-2deg);} }

/* ============================================================
   DASHBOARD, signature element: stats arranged like a syllable
   block (초성/중성 top pair + 종성 bottom bar), echoing how every
   Hangul syllable is literally constructed from its parts.
   ============================================================ */
.hero-card{
  background:var(--hero-bg); color:var(--hero-text); border-radius:var(--radius-lg);
  padding:26px 28px; position:relative; overflow:hidden; margin-bottom:22px;
}
.hero-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; position:relative; z-index:1;}
.hero-greet{ font-size:22px; font-family:var(--font-display); }
.hero-greet .kr{ font-family:var(--font-kr); }
.hero-sub{ color:var(--hero-dim); font-size:13.5px; margin-top:5px; max-width:44ch; line-height:1.5;}
.streak-chip{
  display:flex; align-items:center; gap:7px; background:rgba(255,255,255,0.09);
  border:1px solid rgba(255,255,255,0.14); padding:8px 14px; border-radius:var(--radius-sm);
  flex-shrink:0;
}
.streak-chip svg{ width:18px;height:18px; animation:flameFlicker 1.8s ease-in-out infinite; transform-origin:center bottom; }
.streak-num{ font-size:18px; font-weight:700; line-height:1; }
.streak-label{ font-size:10.5px; color:var(--hero-dim); text-transform:uppercase; letter-spacing:0.06em; }

/* the "block": 2 cells on top (초성=streak/level, 중성=today), 1 wide cell on bottom (종성=overall) */
.syllable-stats{
  display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto auto;
  gap:1px; margin-top:20px; background:rgba(255,255,255,0.14); border-radius:var(--radius-md);
  overflow:hidden; position:relative; z-index:1;
}
.syl-cell{ background:rgba(255,255,255,0.055); padding:16px 18px; }
.syl-cell.wide{ grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; }
.syl-cell-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.07em; color:var(--hero-faint); margin-bottom:6px; }
.syl-cell-value{ font-size:24px; font-weight:700; font-family:var(--font-display); line-height:1; }
.syl-cell .progress-track{ background:rgba(255,255,255,0.15); flex:1; min-width:140px; }
.syl-cell .progress-fill{ background:var(--gold); }
.xp-to-next{ font-size:11.5px; color:var(--hero-faint); white-space:nowrap; }

.continue-card{
  display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
  padding:20px 22px; margin-bottom:22px;
}
.continue-left{ display:flex; align-items:center; gap:16px; }
.continue-icon{ width:46px;height:46px; border-radius:var(--radius-md); background:var(--celadon-pale); color:var(--celadon-deep); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.continue-icon svg{ width:22px;height:22px; }
.continue-eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:700; }
.continue-title{ font-size:17px; font-weight:700; margin-top:2px; }

.stat-card{ padding:18px; display:flex; flex-direction:column; gap:10px; }
.stat-card-top{ display:flex; align-items:center; justify-content:space-between; }
.stat-card-icon{ width:32px;height:32px;border-radius:8px; display:flex;align-items:center;justify-content:center; }
.stat-card-icon svg{ width:16px;height:16px; }
.stat-card-num{ font-size:20px; font-weight:700; font-family:var(--font-display); }
.stat-card-label{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }

.achv-row{ display:flex; gap:10px; flex-wrap:wrap; }
.achv-chip{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border-soft); border-radius:20px; padding:6px 12px 6px 6px; }
.achv-chip-icon{ width:26px;height:26px;border-radius:50%; background:var(--gold-pale); color:var(--gold); display:flex;align-items:center;justify-content:center; flex-shrink:0;}
.achv-chip-icon svg{ width:13px;height:13px; }
.achv-chip span{ font-size:12px; font-weight:600; }

/* ============================================================
   HANGUL SECTION
   ============================================================ */
.subtab-row{ display:flex; gap:6px; margin-bottom:22px; flex-wrap:wrap; border-bottom:1px solid var(--border-soft); padding-bottom:0;}
.subtab{
  padding:9px 15px; font-size:13.5px; font-weight:600; color:var(--ink-soft); background:none; border:none;
  cursor:pointer; position:relative; top:1px; border-bottom:2px solid transparent;
}
.subtab:hover{ color:var(--ink); }
.subtab.active{ color:var(--celadon-deep); border-bottom-color:var(--celadon-deep); }

.jamo-card{
  aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  cursor:pointer; position:relative; transition:transform 0.15s ease, box-shadow 0.15s ease; padding:8px;
}
.jamo-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--celadon); }
.jamo-card .jamo-char{ font-size:30px; font-family:var(--font-kr); line-height:1; }
.jamo-card .jamo-rom{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-soft); }
.jamo-card.learned::after{
  content:''; position:absolute; top:7px; right:7px; width:8px;height:8px; border-radius:50%; background:var(--celadon);
}

.jamo-detail-back{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); background:none;border:none;cursor:pointer; margin-bottom:16px; font-weight:600; }
.jamo-detail-back:hover{ color:var(--ink); }
.jamo-detail-grid{ display:grid; grid-template-columns:320px 1fr; gap:26px; align-items:start; }
.stroke-stage{
  background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--radius-lg);
  padding:18px; display:flex; flex-direction:column; align-items:center; gap:12px;
}
.stroke-canvas-wrap{ position:relative; width:220px; height:220px; }
.stroke-canvas-wrap svg{ width:100%; height:100%; }
.stroke-guide-path{ fill:none; stroke:var(--border); stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
.stroke-anim-path{ fill:none; stroke:var(--ink); stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
.stroke-number{ font-family:var(--font-mono); font-size:10px; fill:var(--celadon-deep); font-weight:700; }
.trace-canvas{ position:absolute; top:0; left:0; touch-action:none; cursor:crosshair; border-radius:8px; }
.stroke-controls{ display:flex; gap:8px; }
.jamo-info-list{ display:flex; flex-direction:column; gap:14px; }
.info-row{ display:flex; gap:12px; align-items:flex-start; }
.info-row-label{ width:88px; flex-shrink:0; font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:700; padding-top:2px;}
.info-row-value{ font-size:14.5px; line-height:1.5; }
.example-box{ background:var(--celadon-pale); border-radius:var(--radius-md); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.example-kr{ font-family:var(--font-kr); font-size:19px; font-weight:700; color:var(--celadon-deep); }
.example-rom{ font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); margin-top:2px; }

.audio-btn{
  width:34px;height:34px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:all 0.15s ease;
}
.audio-btn:hover{ background:var(--celadon); border-color:var(--celadon); color:var(--on-celadon); }
.audio-btn svg{ width:15px;height:15px; }

.builder-wrap{ display:flex; gap:28px; align-items:center; flex-wrap:wrap; }
.builder-display{
  width:150px;height:150px; border-radius:var(--radius-lg); background:var(--surface-2); border:2px dashed var(--border);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-kr); font-size:64px; color:var(--ink); flex-shrink:0;
}
.builder-picker{ display:flex; flex-direction:column; gap:14px; flex:1; min-width:240px; }
.picker-row{ display:flex; align-items:center; gap:12px; }
.picker-label{ width:64px; font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; flex-shrink:0; }
.chip-select{ display:flex; flex-wrap:wrap; gap:6px; }
.chip-opt{
  padding:6px 11px; font-family:var(--font-kr); font-size:14px; border-radius:7px; border:1px solid var(--border);
  background:var(--surface); cursor:pointer; transition:all 0.12s ease;
}
.chip-opt:hover{ border-color:var(--celadon); }
.chip-opt.sel{ background:var(--ink); color:var(--surface); border-color:var(--ink); }

.block-anatomy{ display:flex; gap:22px; flex-wrap:wrap; margin-top:8px; }
.anatomy-diagram{
  width:110px;height:110px; border-radius:10px; overflow:hidden; display:grid; flex-shrink:0;
  border:1px solid var(--border); background:var(--surface);
}
.anatomy-cell{ display:flex; align-items:center; justify-content:center; font-family:var(--font-kr); font-size:22px; font-weight:700; border:1px solid var(--border-soft); }
.anatomy-label{ font-size:12.5px; color:var(--ink-soft); line-height:1.6; }

.quiz-stage{ text-align:center; padding:34px 22px; }
.quiz-prompt-char{ font-family:var(--font-kr); font-size:76px; line-height:1; margin-bottom:6px; }
.quiz-prompt-sub{ font-size:13px; color:var(--ink-soft); margin-bottom:22px; }
.quiz-options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:420px; margin:0 auto; }
.quiz-opt{
  padding:14px; border-radius:var(--radius-md); border:1.5px solid var(--border); background:var(--surface);
  font-size:15px; font-weight:600; cursor:pointer; transition:all 0.12s ease;
}
.quiz-opt:hover{ border-color:var(--celadon); background:var(--celadon-pale); }
.quiz-opt.correct{ border-color:var(--celadon); background:var(--celadon-pale); color:var(--celadon-deep); }
.quiz-opt.wrong{ border-color:var(--seal); background:var(--seal-pale); color:var(--seal-deep); }
.quiz-score-line{ font-size:13px; color:var(--ink-soft); margin-top:18px; }

/* ============================================================
   VOCAB / PHRASES, three-tier typography: script (hero),
   romanization (mono, the sound), meaning (body, the sense).
   ============================================================ */
.category-card{ padding:18px; cursor:pointer; transition:transform 0.15s ease, box-shadow 0.15s ease; }
.category-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
.cat-icon{ width:38px;height:38px;border-radius:10px; background:var(--celadon-pale); color:var(--celadon-deep); display:flex;align-items:center;justify-content:center; margin-bottom:12px;}
.cat-icon svg{ width:19px;height:19px; }
.cat-name{ font-size:15px; font-weight:700; margin-bottom:8px; }
.cat-progress-line{ display:flex; align-items:center; gap:8px; }
.cat-progress-line span{ font-size:11.5px; color:var(--ink-soft); font-family:var(--font-mono); white-space:nowrap; }

.item-row{
  display:flex; align-items:center; gap:16px; padding:15px 18px; border-bottom:1px solid var(--border-soft);
}
.item-row:last-child{ border-bottom:none; }
.item-main{ flex:1; min-width:0; }
.item-kr{ font-family:var(--font-kr); font-size:19px; font-weight:700; }
.item-rom{ font-family:var(--font-mono); font-size:12px; color:var(--celadon-deep); margin-top:3px; }
.item-en{ font-size:13.5px; color:var(--ink-soft); margin-top:3px; }
.item-status-btn{
  font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:16px; border:1px solid var(--border);
  background:var(--surface); cursor:pointer; white-space:nowrap; flex-shrink:0; transition:all 0.12s ease;
}
.item-status-btn.known{ background:var(--celadon-pale); border-color:var(--celadon); color:var(--celadon-deep); }

.flash-stage{ display:flex; flex-direction:column; align-items:center; padding:8px 0 0; }
.flashcard{
  width:100%; max-width:420px; height:230px; perspective:1200px; cursor:pointer; margin-bottom:20px;
}
.flashcard-inner{ position:relative; width:100%; height:100%; transition:transform 0.5s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d; }
.flashcard.flipped .flashcard-inner{ transform:rotateY(180deg); }
.flashcard-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius-lg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:20px;
  background:var(--surface); border:1px solid var(--border-soft); box-shadow:var(--shadow-md);
}
.flashcard-face.back{ transform:rotateY(180deg); background:var(--hero-bg); color:var(--hero-text); }
.flash-kr{ font-family:var(--font-kr); font-size:42px; font-weight:700; text-align:center; }
.flash-rom{ font-family:var(--font-mono); font-size:14px; color:var(--celadon-deep); }
.flashcard-face.back .flash-rom{ color:var(--hero-faint); }
.flash-en{ font-size:22px; font-weight:600; font-family:var(--font-display); text-align:center; }
.flash-hint{ font-size:11px; color:var(--ink-faint); position:absolute; bottom:14px; }
.flashcard-face.back .flash-hint{ color:var(--hero-faint); }
.flash-controls{ display:flex; gap:12px; width:100%; max-width:420px; }
.flash-controls .btn{ flex:1; }
.flash-progress-row{ display:flex; align-items:center; gap:10px; width:100%; max-width:420px; margin-bottom:16px; font-size:12px; color:var(--ink-soft); }
.flash-progress-row .progress-track{ flex:1; }

.scenario-card{ padding:16px 18px; display:flex; align-items:center; gap:14px; cursor:pointer; transition:transform 0.15s ease, box-shadow 0.15s ease;}
.scenario-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
.scenario-emoji{ width:42px;height:42px; border-radius:10px; background:var(--seal-pale); display:flex;align-items:center;justify-content:center; font-size:19px; flex-shrink:0; }

/* ============================================================
   GRAMMAR
   ============================================================ */
.lesson-card{ padding:17px 19px; display:flex; align-items:center; gap:15px; cursor:pointer; transition:transform 0.15s ease, box-shadow 0.15s ease;}
.lesson-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
.lesson-num{ width:34px;height:34px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border-soft); display:flex;align-items:center;justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:13px; color:var(--ink-soft); flex-shrink:0; }
.lesson-card.done .lesson-num{ background:var(--celadon); color:var(--on-celadon); border-color:var(--celadon); }
.lesson-title{ font-weight:700; font-size:14.5px; }
.lesson-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
svg.check-icon{ width:20px;height:20px; color:var(--celadon); flex-shrink:0; }

.gram-example{ background:var(--surface-2); border-radius:var(--radius-md); padding:14px 16px; margin-top:8px; }
.gram-example + .gram-example{ margin-top:10px; }
.gram-ex-kr{ font-family:var(--font-kr); font-size:16.5px; font-weight:600; }
.gram-ex-rom{ font-family:var(--font-mono); font-size:12px; color:var(--celadon-deep); margin-top:4px; }
.gram-ex-en{ font-size:13px; color:var(--ink-soft); margin-top:4px; font-style:italic; }
.gram-body{ font-size:14.5px; line-height:1.7; color:var(--ink); }
.gram-body strong{ color:var(--celadon-deep); }

/* ============================================================
   TYPING PRACTICE, 2-beolsik keyboard visual
   ============================================================ */
.kb{ display:flex; flex-direction:column; gap:6px; align-items:center; }
.kb-row{ display:flex; gap:6px; }
.kb-key{
  width:52px; height:56px; border-radius:8px; background:var(--surface); border:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; position:relative;
  box-shadow:0 2px 0 var(--border);
}
.kb-key .kb-jamo{ font-family:var(--font-kr); font-size:17px; font-weight:700; }
.kb-key .kb-latin{ font-family:var(--font-mono); font-size:8.5px; color:var(--ink-faint); position:absolute; bottom:3px; right:5px; }
.kb-key.shift-jamo::before{
  content: attr(data-shift); position:absolute; top:3px; left:6px; font-family:var(--font-kr); font-size:11px; color:var(--seal); font-weight:700;
}
.kb-key.wide{ width:112px; }

.type-sandbox{ background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:16px; }
.type-output{
  min-height:64px; font-family:var(--font-kr); font-size:28px; padding:14px 16px; background:var(--surface);
  border-radius:8px; border:1px solid var(--border-soft); display:flex; align-items:center; word-break:break-all;
}
.type-output.placeholder{ color:var(--ink-faint); font-size:15px; font-family:var(--font-body); }
.type-input-hidden{ position:absolute; opacity:0; pointer-events:none; }

.challenge-card{ text-align:center; padding:26px 20px; }
.challenge-target{ font-family:var(--font-kr); font-size:38px; font-weight:700; margin-bottom:4px; }
.challenge-rom{ font-family:var(--font-mono); color:var(--ink-soft); font-size:13px; margin-bottom:18px; }
.challenge-input-display{
  font-family:var(--font-kr); font-size:32px; min-height:52px; border-bottom:2px solid var(--border);
  display:flex; align-items:center; justify-content:center; padding:6px; margin-bottom:14px;
}
.challenge-input-display.match{ border-color:var(--celadon); color:var(--celadon-deep); }

/* ============================================================
   READING
   ============================================================ */
.passage-card{ padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px; cursor:pointer; transition:transform 0.15s ease, box-shadow 0.15s ease;}
.passage-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
.passage-title{ font-weight:700; font-size:15px; }
.passage-meta{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
.passage-text{ font-family:var(--font-kr); font-size:19px; line-height:2.1; white-space:pre-line; }
.passage-line-rom{ font-family:var(--font-mono); font-size:12.5px; color:var(--celadon-deep); display:block; line-height:1.6; margin-top:2px;}
.passage-line-en{ font-size:12.5px; color:var(--ink-soft); display:block; font-style:italic; margin-top:1px; margin-bottom:10px; }
.toggle-row{ display:flex; gap:8px; margin-bottom:18px; }
.toggle-btn{ padding:7px 13px; border-radius:16px; border:1px solid var(--border); background:var(--surface); font-size:12.5px; font-weight:700; cursor:pointer; }
.toggle-btn.on{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
.glossary-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:6px; }
.gloss-item{ font-size:12.5px; padding:8px 10px; background:var(--surface-2); border-radius:8px; }
.gloss-item b{ font-family:var(--font-kr); font-size:14px; }

/* ============================================================
   PROGRESS / ACHIEVEMENTS
   ============================================================ */
.progress-row-item{ display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--border-soft); }
.progress-row-item:last-child{ border-bottom:none; }
.pr-icon{ width:36px;height:36px;border-radius:9px; display:flex;align-items:center;justify-content:center; flex-shrink:0; }
.pr-icon svg{ width:17px;height:17px; }
.pr-main{ flex:1; min-width:0; }
.pr-label-row{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
.pr-label-row b{ font-weight:700; }
.pr-label-row span{ color:var(--ink-soft); font-family:var(--font-mono); font-size:11.5px; }

.achv-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
.achv-card{ padding:16px 12px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; }
.achv-card.locked{ opacity:0.42; }
.achv-badge{ width:44px;height:44px;border-radius:50%; background:var(--gold-pale); color:var(--gold); display:flex;align-items:center;justify-content:center; }
.achv-badge svg{ width:21px;height:21px; }
.achv-card.locked .achv-badge{ background:var(--surface-2); color:var(--ink-faint); }
.achv-name{ font-size:12px; font-weight:700; line-height:1.3; }
.achv-desc{ font-size:10.5px; color:var(--ink-soft); line-height:1.3; }

/* ============================================================
   TOAST
   ============================================================ */
#toast-container{ position:fixed; top:20px; right:20px; z-index:999; display:flex; flex-direction:column; gap:10px; }
.toast{
  display:flex; align-items:center; gap:11px; background:var(--hero-bg); color:var(--hero-text);
  padding:13px 18px; border-radius:var(--radius-md); box-shadow:var(--shadow-lg);
  animation:toastIn 0.35s cubic-bezier(.2,0,.2,1) both;
  max-width:300px;
}
.toast.leaving{ animation:toastOut 0.3s ease both; }
@keyframes toastIn{ from{ opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);} }
@keyframes toastOut{ to{ opacity:0; transform:translateX(30px); } }
.toast-icon{ width:32px;height:32px;border-radius:50%; background:var(--gold); display:flex;align-items:center;justify-content:center; flex-shrink:0; }
.toast-icon svg{ width:16px;height:16px; }
.toast-title{ font-size:12px; font-weight:700; }
.toast-sub{ font-size:12.5px; color:var(--hero-dim); }


/* ============================================================
   V3 REFINEMENTS: satisfying feedback
   ============================================================ */
.quiz-opt.correct{ animation:popIn 0.35s cubic-bezier(.2,0,.2,1); }
.quiz-opt.wrong{ animation:shake 0.38s ease; }
@keyframes shake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }
.btn:active{ transform:scale(0.97); }
.card{ transition:box-shadow 0.2s ease, border-color 0.2s ease, transform 0.15s ease; }
#confetti-canvas{ position:fixed; inset:0; pointer-events:none; z-index:1000; }

/* ============================================================
   SESSION TIMER
   ============================================================ */
.timer-hero{ display:grid; grid-template-columns:200px 1fr; gap:26px; align-items:center; }
.timer-ring-wrap{ position:relative; width:200px; height:200px; }
.timer-ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
.timer-ring-bg{ fill:none; stroke:var(--border-soft); stroke-width:10; }
.timer-ring-fg{ fill:none; stroke:var(--celadon); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset 0.9s linear; }
.timer-ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.timer-time{ font-family:var(--font-mono); font-size:38px; font-weight:700; letter-spacing:-0.02em; line-height:1; }
.timer-seg-label{ font-size:12px; color:var(--ink-soft); margin-top:6px; text-transform:uppercase; letter-spacing:0.06em; font-weight:700; }
.plan-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
.plan-card{ padding:14px 10px; border-radius:var(--radius-md); border:1.5px solid var(--border); background:var(--surface); cursor:pointer; text-align:center; transition:all 0.15s ease; }
.plan-card:hover{ border-color:var(--celadon); transform:translateY(-2px); }
.plan-card.sel{ border-color:var(--ink); background:var(--ink); color:var(--surface); }
.plan-card .plan-min{ font-size:22px; font-weight:700; font-family:var(--font-display); line-height:1; }
.plan-card .plan-name{ font-size:11.5px; margin-top:5px; opacity:0.8; font-weight:600; }
.seg-list{ display:flex; flex-direction:column; gap:6px; }
.seg-row{ display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:8px; background:var(--surface-2); border:1px solid transparent; font-size:13.5px; }
.seg-row.current{ background:var(--celadon-pale); border-color:var(--celadon); font-weight:700; }
.seg-row.done{ opacity:0.5; text-decoration:line-through; }
.seg-dot{ width:9px; height:9px; border-radius:50%; background:var(--border); flex-shrink:0; }
.seg-row.current .seg-dot{ background:var(--celadon); box-shadow:0 0 0 4px rgba(76,145,134,0.2); }
.seg-row.done .seg-dot{ background:var(--celadon-deep); }

.timer-widget{
  position:fixed; bottom:20px; right:20px; z-index:90; background:var(--hero-bg); color:var(--hero-text);
  border-radius:14px; padding:10px 12px 10px 16px; display:flex; align-items:center; gap:14px;
  box-shadow:var(--shadow-lg); animation:toastIn 0.3s ease both; cursor:pointer; max-width:340px;
}
.tw-time{ font-family:var(--font-mono); font-size:20px; font-weight:700; }
.tw-seg{ font-size:11px; color:var(--hero-dim); text-transform:uppercase; letter-spacing:0.05em; }
.tw-btn{ width:34px;height:34px; border-radius:50%; border:none; background:rgba(255,255,255,0.12); color:var(--hero-text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.tw-btn:hover{ background:rgba(255,255,255,0.22); }
.tw-btn svg{ width:15px; height:15px; }

/* ============================================================
   QUESTS, HEATMAP, WEEK BARS
   ============================================================ */
.quest-row{ display:flex; align-items:center; gap:13px; padding:12px 0; border-bottom:1px solid var(--border-soft); }
.quest-row:last-child{ border-bottom:none; }
.quest-check{ width:26px;height:26px; border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--on-celadon); transition:all var(--t-mid) var(--ease); }
.quest-row.done .quest-check{ background:var(--celadon); border-color:var(--celadon); animation:popIn 0.4s ease; }
.quest-row.done .quest-title{ color:var(--ink-soft); text-decoration:line-through; }
.quest-title{ font-size:14px; font-weight:600; }
.week-bars{ display:flex; align-items:flex-end; gap:8px; height:110px; }
.week-bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
.week-bar{ width:100%; max-width:36px; border-radius:6px 6px 3px 3px; background:var(--celadon-pale-2); min-height:4px; transition:height 0.6s cubic-bezier(.4,0,.2,1); }
.week-bar.today{ background:var(--celadon); }
.week-bar-label{ font-size:10.5px; color:var(--ink-soft); font-weight:600; }
.week-bar-val{ font-size:10px; color:var(--ink-faint); font-family:var(--font-mono); }
.heatmap{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,1fr); gap:3px; overflow-x:auto; padding-bottom:4px; }
.hm-cell{ width:13px; height:13px; border-radius:3px; background:var(--hm-0); }
.hm-1{ background:var(--hm-1); } .hm-2{ background:var(--hm-2); } .hm-3{ background:var(--hm-3); } .hm-4{ background:var(--hm-4); }
.hm-legend{ display:flex; align-items:center; gap:4px; font-size:11px; color:var(--ink-soft); margin-top:8px; }
.wotd{ display:flex; align-items:center; gap:18px; }
.wotd-kr{ font-family:var(--font-kr); font-size:40px; font-weight:700; line-height:1; }

/* ============================================================
   VIDEOS
   ============================================================ */
.video-frame{
  position:relative; width:100%; aspect-ratio:16/9;
  border-radius:var(--radius-md); overflow:hidden; background:#0B1416;
  box-shadow:var(--shadow-md);
}
.video-thumb{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  opacity:0.82; transition:opacity var(--t-mid) var(--ease), transform var(--t-slow) var(--ease-out);
}
.video-frame:hover .video-thumb{ opacity:1; transform:scale(1.03); }
.video-play{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  border:none; cursor:pointer; padding:0;
  background:linear-gradient(0deg, rgba(0,0,0,0.42), rgba(0,0,0,0.04));
}
.video-play span{
  width:66px; height:66px; border-radius:50%;
  background:var(--seal); color:var(--on-seal);
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow-lg), 0 0 0 0 rgba(195,64,44,0.45);
  transition:transform var(--t-mid) var(--ease-spring), box-shadow var(--t-mid) var(--ease);
}
/* The play glyph needs an explicit size and a nudge: its bounding box is
   wider on the left than the visual triangle, so dead-centre looks off. */
.video-play span svg.ic{ width:26px; height:26px; margin-left:3px; }
.video-play:hover span{ transform:scale(1.09); box-shadow:var(--shadow-lg), 0 0 0 12px rgba(195,64,44,0.14); }
.video-play:active span{ transform:scale(0.98); }

/* Placeholder state: the real player is the #yt-host element on top. */
.video-frame.is-playing{ background:#0B1416; }
.video-loading{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:10px;
  color:rgba(255,255,255,0.55); font-size:13px;
}
.video-spinner{
  width:16px; height:16px; border-radius:50%;
  border:2px solid rgba(255,255,255,0.22); border-top-color:rgba(255,255,255,0.75);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* The persistent player. Absolutely positioned in document coordinates so
   it scrolls with the page for free; kept under the sticky mobile topbar
   (z-index 50) and the timer widget (90). */
#yt-host{
  position:absolute; top:0; left:0; z-index:4;
  border-radius:var(--radius-md); overflow:hidden;
  background:#0B1416; box-shadow:var(--shadow-md);
  will-change:transform;
}
#yt-host[hidden]{ display:none; }
#yt-host iframe{ display:block; width:100%; height:100%; border:0; }

.video-bar{
  display:flex; justify-content:space-between; align-items:center;
  gap:10px; margin-top:10px; flex-wrap:wrap;
}
.video-hint{ font-size:11.5px; color:var(--ink-faint); }
.video-note{
  display:flex; gap:10px; align-items:flex-start;
  margin-top:10px; padding:11px 13px; border-radius:var(--radius-sm);
  background:var(--gold-pale); color:var(--ink);
  border:1px solid color-mix(in srgb, var(--gold) 34%, transparent);
  font-size:12.5px; line-height:1.5;
}
.video-note svg.ic{ width:16px; height:16px; color:var(--gold); margin-top:1px; }
.video-note .mono{ font-size:11.5px; }
.ep-row{ display:flex; align-items:center; gap:13px; padding:12px 16px; border-bottom:1px solid var(--border-soft); }
.ep-row:last-child{ border-bottom:none; }
.ep-num{ width:38px; height:38px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border-soft); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--ink-soft); flex-shrink:0; }
.ep-row.watched .ep-num{ background:var(--celadon); color:var(--on-celadon); border-color:var(--celadon); }

/* ============================================================
   WRITING, KEYPAD, RECORDER, MINIMAL PAIRS
   ============================================================ */
.hw-stage{ position:relative; width:280px; height:280px; border-radius:var(--radius-lg); background:var(--surface); border:1px solid var(--border); overflow:hidden; touch-action:none; margin:0 auto;
  background-image:linear-gradient(var(--border-soft) 1px, transparent 1px), linear-gradient(90deg, var(--border-soft) 1px, transparent 1px); background-size:140px 140px; background-position:-1px -1px; }
.hw-stage canvas{ position:absolute; inset:0; }
.write-output{ min-height:62px; font-family:var(--font-kr); font-size:26px; padding:12px 16px; background:var(--surface); border-radius:10px; border:2px solid var(--border); display:flex; align-items:center; word-break:break-all; }
.write-output.focus{ border-color:var(--celadon); }
.write-output .caret{ display:inline-block; width:2px; height:28px; background:var(--celadon); margin-left:2px; animation:blink 1s step-end infinite; vertical-align:middle; }
@keyframes blink{ 50%{ opacity:0; } }
.text-input{ width:100%; font-family:var(--font-kr); font-size:20px; padding:12px 14px; border-radius:10px; border:2px solid var(--border); background:var(--surface); color:var(--ink); }
.text-input:focus{ outline:none; border-color:var(--celadon); }
textarea.text-input{ min-height:120px; resize:vertical; font-size:17px; line-height:1.6; }
.keypad{ display:flex; flex-direction:column; gap:5px; margin-top:12px; user-select:none; }
.keypad-row{ display:flex; gap:5px; justify-content:center; }
.kp-key{ flex:1; max-width:46px; height:46px; border-radius:8px; border:1px solid var(--border); background:var(--surface); font-family:var(--font-kr); font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 2px 0 var(--border); transition:transform 0.05s ease; padding:0; }
.kp-key:active{ transform:translateY(2px); box-shadow:none; }
.kp-key.wide{ max-width:96px; flex:2; font-family:var(--font-body); font-size:12.5px; }
.kp-key.on{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
.rec-btn{ width:72px; height:72px; border-radius:50%; border:none; background:var(--seal); color:var(--on-seal); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow-md); transition:transform 0.15s ease; }
.rec-btn:hover{ transform:scale(1.05); }
.rec-btn.recording{ animation:pulse 1.2s ease-in-out infinite; background:var(--seal-deep); }
.rec-btn svg{ width:28px; height:28px; }
@keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(195,64,44,0.45);} 50%{ box-shadow:0 0 0 16px rgba(195,64,44,0);} }
.mp-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:460px; margin:0 auto; }
.mp-opt{ padding:16px 8px; border-radius:var(--radius-md); border:1.5px solid var(--border); background:var(--surface); cursor:pointer; text-align:center; transition:all 0.12s ease; }
.mp-opt:hover{ border-color:var(--celadon); }
.mp-opt.correct{ border-color:var(--celadon); background:var(--celadon-pale); animation:popIn 0.35s ease; }
.mp-opt.wrong{ border-color:var(--seal); background:var(--seal-pale); animation:shake 0.38s ease; }
.mp-opt .kr{ font-size:26px; font-weight:700; display:block; }
.mp-opt small{ font-size:11px; color:var(--ink-soft); }
.settings-row{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); }
.switch{ width:34px; height:20px; border-radius:12px; background:var(--border); border:none; position:relative; cursor:pointer; transition:background 0.2s ease; flex-shrink:0; }
.switch::after{ content:''; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:#fff; transition:transform 0.2s ease; }
.switch.on{ background:var(--celadon); }
.switch.on::after{ transform:translateX(14px); }
.theme-seg{ display:flex; gap:2px; padding:2px; border-radius:var(--radius-full); background:var(--surface-3); border:1px solid var(--border-soft); }
.theme-seg-btn{
  width:26px; height:22px; border:none; background:transparent; color:var(--ink-faint);
  border-radius:var(--radius-full); cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.theme-seg-btn svg.ic{ width:13px; height:13px; }
.theme-seg-btn:hover{ color:var(--ink-soft); }
.theme-seg-btn.sel{ background:var(--surface); color:var(--celadon-deep); box-shadow:var(--shadow-sm); }
.sentence-line{ display:flex; gap:10px; align-items:flex-start; padding:8px 0; }
.sentence-line + .sentence-line{ border-top:1px dashed var(--border-soft); }
.sentence-line.playing .passage-kr-line{ color:var(--celadon-deep); }
.line-play{ width:28px; height:28px; border-radius:50%; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; margin-top:4px; }
.line-play:hover{ background:var(--celadon); color:var(--on-celadon); border-color:var(--celadon); }
.line-play svg{ width:12px; height:12px; }
.passage-kr-line{ font-family:var(--font-kr); font-size:19px; line-height:1.7; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:900px){
  /* #app is a row on desktop (sidebar | main). On a phone the sidebar is
     swapped for the topbar, so the axis has to turn as well; otherwise the
     topbar and main sit SIDE BY SIDE, the topbar stretches to its full
     scroll width and main collapses to 0. */
  #app{ flex-direction:column; }
  .sidebar{ display:none; }
  .main{ width:100%; }
  .topbar{
    display:flex; flex-direction:column; position:sticky; top:0; z-index:50;
    background:color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter:saturate(1.6) blur(12px);
    -webkit-backdrop-filter:saturate(1.6) blur(12px);

function composeHangul(choChar, jungChar, jongChar){
  const ci = CHO_ORDER.indexOf(choChar);
  const ji = JUNG_ORDER.indexOf(jungChar);

const GRAMMAR_LESSONS = [
  { id:'wordorder', title:'Sentence Structure: Subject-Object-Verb', sub:'The verb always comes last', body:'English builds sentences as Subject-Verb-Object: "I eat rice." Korean puts the verb at the very end: Subject-Object-Verb. So "I eat rice" becomes, word for word, "I rice eat." This single rule affects every sentence you will ever build in Korean, so it is worth internalizing early. A helpful side effect: since the verb always comes last, Korean listeners often wait until the very end of a sentence to know what happened.', examples:[
    {kr:'저는 밥을 먹어요.',rom:'Jeoneun bapeul meogeoyo.',en:'I eat rice. (lit. "I rice eat")'},
    {kr:'저는 학교에 가요.',rom:'Jeoneun hakgyoe gayo.',en:'I go to school. (lit. "I to-school go")'},
  ]},
  { id:'particles1', title:'Topic & Subject Particles: 은/는 and 이/가', sub:'Small syllables attached to the noun before them', body:'Korean nouns get small "particles" stuck onto the end to show their job in the sentence. 은/는 marks the topic (what the sentence is about); 이/가 marks the grammatical subject more narrowly, often introducing new information. Which one you attach depends on whether the noun ends in a consonant or a vowel: use 은 and 이 after a consonant, 는 and 가 after a vowel. Beginners can lean on 은/는 for most general statements and refine the 이/가 feel with more exposure.', examples:[
    {kr:'저는 학생이에요.',rom:'Jeoneun haksaengieyo.',en:'I am a student. (저 ends in a vowel sound, so 는)'},
    {kr:'날씨가 좋아요.',rom:'Nalssiga joayo.',en:'The weather is nice. (날씨 ends in a vowel, so 가)'},
  ]},
  { id:'particles2', title:'Object Particle: 을/를', sub:'Marking the thing that receives the action', body:'The object of a verb, the thing being eaten, watched, bought, gets 을 after a consonant or 를 after a vowel. Combined with the SOV order from lesson 1, this particle is what lets Korean shuffle word order more freely than English: because the particle itself marks the object, the object does not have to sit in one fixed spot to be understood.', examples:[
    {kr:'저는 커피를 마셔요.',rom:'Jeoneun keopireul masyeoyo.',en:'I drink coffee.'},
    {kr:'책을 읽어요.',rom:'Chaegeul ilgeoyo.',en:'I read a book.'},

  { id:'particles3', title:'Location Particles: 에 and 에서', sub:'Where something exists vs. where something happens', body:'에 marks a destination or a place something simply exists ("at/to"). 에서 marks the location where an action takes place ("at/in," doing something). A quick test: if you could insert the word "doing" in English before the location, reach for 에서.', examples:[
    {kr:'집에 있어요.',rom:'Jibe isseoyo.',en:'I am at home. (existing at a place, so 에)'},
    {kr:'식당에서 먹어요.',rom:'Sikdangeseo meogeoyo.',en:'I eat at the restaurant. (an action happening there, so 에서)'},
  ]},
  { id:'present', title:'Present Tense: -아요/어요', sub:'The everyday, friendly polite ending', body:'To make a verb polite and present-tense in everyday speech, drop 다 from the dictionary form and add 아요 or 어요, depending on the vowel in the last syllable of the stem: 아요 follows stems whose last vowel is ㅏ or ㅗ; 어요 follows everything else. This -아요/어요 ending is what most conversations actually sound like day to day, more casual than -ㅂ니다, but still polite and appropriate with strangers, coworkers, and most adults.', examples:[
    {kr:'가다 → 가요',rom:'gada → gayo',en:'to go → I go / going (polite)'},

  { id:'formal', title:'Formal Polite: -ㅂ니다/습니다', sub:'The crisp, formal ending you hear in news and speeches', body:'Attach ㅂ니다 to a stem ending in a vowel, or 습니다 to a stem ending in a consonant, to get the more formal register used in news broadcasts, presentations, the military, and first meetings in business settings. It sounds a bit stiff in casual conversation between friends, but it is never wrong to use, and it is the safest choice when you are unsure how formal to be.', examples:[

  { id:'past', title:'Past Tense: -았어요/었어요', sub:'Talking about what already happened', body:'Past tense follows the same vowel-harmony logic as the present tense: 았어요 after a stem whose last vowel is ㅏ or ㅗ, 었어요 everywhere else. Think of it as inserting an extra 았/었 right before the 어요 ending you already learned.', examples:[

  { id:'negation', title:'Negation: 안 and -지 않다', sub:'Two ways to say "not"', body:'The simplest negative just places 안 directly before the verb. A slightly more formal, sometimes softer alternative attaches -지 않다 to the verb stem instead. For actions outside your control or ability, 못 (meaning "cannot") goes before the verb in the same way 안 does.', examples:[

  { id:'questions', title:'Asking Questions', sub:'Mostly a matter of tone and word choice', body:'In casual -아요/어요 speech, a statement often becomes a question simply by raising your intonation at the end, the words themselves barely change. In formal -ㅂ니다 speech, the ending shifts to -ㅂ니까/습니까. Question words like 뭐 (what), 누구 (who), 어디 (where), and 언제 (when) slot directly into the sentence in the position of the thing being asked about, no need to move them to the front like English does.', examples:[

let state = defaultState();

function vocabKey(catId, idx){ return catId+'::'+idx; }
function phraseKey(scenId, idx){ return scenId+'::'+idx; }
function todayStr(){ return new Date().toLocaleDateString('en-CA'); }
function daysBetween(a,b){
  const d1 = new Date(a+'T00:00:00'), d2 = new Date(b+'T00:00:00');
  return Math.round((d2-d1)/86400000);
}
function levelFromXp(xp){
  const level = Math.floor(xp/100)+1;
  const into = xp%100;
  return { level, into, next:100 };
}

const LOCAL_STORAGE_KEY = 'hangeul-path-progress';
function hasClaudeStorage(){
  return typeof window!=='undefined' && window.storage && typeof window.storage.get==='function';
}
async function loadState(){
  try{
    let raw = null;
    if(hasClaudeStorage()){ const res = await window.storage.get('progress'); raw = res && res.value; }
    else if(typeof localStorage!=='undefined'){ raw = localStorage.getItem(LOCAL_STORAGE_KEY); }
    if(raw){
      const parsed = JSON.parse(raw);
      const def = defaultState();
      state = Object.assign(def, parsed);
      Object.keys(def).forEach(k=>{ const d = defaultState()[k]; if(d && typeof d==='object' && !Array.isArray(d)) state[k] = Object.assign(d, parsed[k]||{}); });
    }
  }catch(e){ state = defaultState(); }
}
async function persistState(){
  try{
    const json = JSON.stringify(state);
    if(hasClaudeStorage()){ await window.storage.set('progress', json); }
    else if(typeof localStorage!=='undefined'){ localStorage.setItem(LOCAL_STORAGE_KEY, json); }
  }catch(e){ /* non-fatal, e.g. private-browsing storage restrictions */ }
}

function touchStreak(){
  const today = todayStr();
  if(state.lastActiveDate === today){ /* already counted today */ }
  else if(state.lastActiveDate && daysBetween(state.lastActiveDate, today) === 1){ state.streak += 1; }
  else { state.streak = 1; }
  state.lastActiveDate = today;
}





function showToast(title, sub, iconName){
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<div class="toast-icon">'+icon(iconName||'star')+'</div><div><div class="toast-title">'+escapeHtml(title)+'</div><div class="toast-sub">'+escapeHtml(sub||'')+'</div></div>';
  container.appendChild(el);
  setTimeout(()=>{
    el.classList.add('leaving');
    setTimeout(()=>el.remove(), 320);
  }, 3800);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function computeTotals(){
  const hangulTotal = CONSONANTS.length+VOWELS.length;
  const hangulDone = state.hangul.learned.length;
  const vocabTotal = totalVocabCount();
  const vocabDone = Object.values(state.vocab.known).filter(Boolean).length;
  const phraseTotal = totalPhraseCount();
  const phraseDone = Object.values(state.phrases.known).filter(Boolean).length;
  const grammarTotal = GRAMMAR_LESSONS.length;
  const grammarDone = state.grammar.completed.length;
  const readingTotal = READING_PASSAGES.length;
  const readingDone = state.reading.completed.length;
  const typingTotal = TYPING_CHALLENGES.length;
  const typingDone = state.typing.completed.length;
  const pronTotal = PRONUNCIATION_RULES.length;
  const pronDone = state.pronunciation.learned.length;
  const irrTotal = IRREGULARS.length;
  const irrDone = state.irregulars.learned.length;
  const overallDone = hangulDone+vocabDone+phraseDone+grammarDone+readingDone+typingDone+pronDone+irrDone;
  const overallTotal = hangulTotal+vocabTotal+phraseTotal+grammarTotal+readingTotal+typingTotal+pronTotal+irrTotal;
  return { hangulTotal,hangulDone,vocabTotal,vocabDone,phraseTotal,phraseDone,grammarTotal,grammarDone,readingTotal,readingDone,typingTotal,typingDone,pronTotal,pronDone,irrTotal,irrDone,overallDone,overallTotal };

function mountStrokeAnimation(){
  const svg = document.getElementById('stroke-svg');
  if(!svg) return;
  const paths = svg.querySelectorAll('.stroke-anim-path');
  paths.forEach((p,i)=>{
    try{
      const len = p.getTotalLength();
      p.style.strokeDasharray = String(len);
      p.style.strokeDashoffset = String(len);
      p.style.transition = 'none';
      void p.getBoundingClientRect();
      setTimeout(()=>{
        p.style.transition = 'stroke-dashoffset 0.65s ease';
        p.style.strokeDashoffset = '0';
      }, i*600+150);
    }catch(e){ /* SVG geometry unavailable in this environment; guide path is still visible */ }
  });
}
function mountTraceCanvas(){
  const canvas = document.getElementById('trace-canvas');
  if(!canvas) return;
  const wrap = canvas.parentElement;
  const size = wrap.clientWidth || 220;
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  if(!ctx) return;
  ctx.strokeStyle = cssVar('--celadon-deep', '#356F63');
  ctx.lineWidth = 5; ctx.lineCap='round'; ctx.lineJoin='round';
  let drawing = false;
  canvas.onpointerdown = (e)=>{
    drawing = true;
    const r = canvas.getBoundingClientRect();
    ctx.beginPath(); ctx.moveTo(e.clientX-r.left, e.clientY-r.top);
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  };
  canvas.onpointermove = (e)=>{
    if(!drawing) return;
    const r = canvas.getBoundingClientRect();
    ctx.lineTo(e.clientX-r.left, e.clientY-r.top); ctx.stroke();
  };
  const stop = ()=>{ drawing = false; };
  canvas.onpointerup = stop; canvas.onpointerleave = stop; canvas.onpointercancel = stop;
}
function clearTraceCanvas(){
  const canvas = document.getElementById('trace-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  if(!ctx) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

/* ---- Hangul quiz ---- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function startHangulQuiz(){
  const pool = CONSONANTS.concat(VOWELS);
  const order = shuffle(pool.map(j=>j.id)).slice(0, Math.min(10,pool.length));
  view.quiz = { order, idx:0, correct:0, answered:false, selected:null, options:null };
  setQuizOptions();
}
function setQuizOptions(){
  const j = findJamoById(view.quiz.order[view.quiz.idx]);
  const pool = CONSONANTS.find(c=>c.id===j.id) ? CONSONANTS : VOWELS;
  const others = shuffle(pool.filter(x=>x.id!==j.id)).slice(0,3);
  view.quiz.options = shuffle([j, ...others].map(o=>o.rom));
}
function renderHangulQuiz(){
  if(!view.quiz){
    return '<div class="card quiz-stage"><h3 style="font-size:17px;margin-bottom:8px;">Ready to test yourself?</h3><p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:20px;">10 quick questions covering the 24 basic letters.</p><button class="btn btn-celadon" data-action="quiz-start">Start Quiz</button></div>';
  }
  const q = view.quiz;
  if(q.idx >= q.order.length){
    const pct = Math.round((q.correct/q.order.length)*100);
    return '<div class="card quiz-stage"><h3 style="font-size:19px;margin-bottom:6px;">Quiz complete!</h3><p style="font-size:15px;color:var(--ink-soft);margin-bottom:18px;">You scored '+q.correct+' / '+q.order.length+' ('+pct+'%)</p><button class="btn btn-celadon" data-action="quiz-start">Try Again</button></div>';
  }
  const j = findJamoById(q.order[q.idx]);
  const correctRom = j.rom;
  return '<div class="card quiz-stage">'+
    '<div class="quiz-prompt-char kr">'+j.char+'</div>'+
    '<div class="quiz-prompt-sub">Question '+(q.idx+1)+' of '+q.order.length+' \u00b7 What sound does this make?</div>'+
    '<div class="quiz-options">'+q.options.map(opt=>{
      let cls = 'quiz-opt';
      if(q.answered){
        if(opt===correctRom) cls += ' correct';
        else if(opt===q.selected) cls += ' wrong';
      }
      return '<button class="'+cls+'" '+(q.answered?'':'data-action="quiz-answer" data-rom="'+opt+'"')+'>'+opt+'</button>';
    }).join('')+'</div>'+
    '<div class="quiz-score-line">Correct so far: '+q.correct+'</div>'+
    (q.answered ? '<button class="btn btn-primary" style="margin-top:16px;" data-action="quiz-next">'+(q.idx+1>=q.order.length?'See Results':'Next Question')+'</button>' : '')+
  '</div>';
}
function answerQuiz(rom){
  const q = view.quiz;
  if(q.answered) return;
  q.answered = true; q.selected = rom;
  const j = findJamoById(q.order[q.idx]);
  if(rom===j.rom){ q.correct++; addXp(2); }
  render();
}
function nextQuizQuestion(){
  const q = view.quiz;
  q.idx++;
  if(q.idx < q.order.length){ q.answered=false; q.selected=null; setQuizOptions(); }
  else {
    if(q.correct===q.order.length){ state.hangul.perfectQuiz = true; addXp(10); }
    persistState();
  }
  render();
}

/* ============================================================
   TYPING SECTION, real-time 2-beolsik composer
   ============================================================ */
function composerFlushInto(cur){
  if(!cur) return '';
  if(cur.cho!=null && cur.jung!=null) return composeHangul(cur.cho, cur.jung, cur.jong||undefined);
  if(cur.jung!=null && cur.cho==null) return cur.jung;
  if(cur.cho!=null) return cur.cho;
  return '';
}
function composerKeyPress(jamo){
  if(!jamo) return;
  const isVowel = JUNG_ORDER.includes(jamo);
  const isCons = CHO_ORDER.includes(jamo);
  let cur = typingComposer.cur;
  const flush = ()=>{ if(cur){ typingComposer.committed += composerFlushInto(cur); } cur = null; };
  if(isCons){
    if(!cur){ cur = {cho:jamo, jung:null, jong:null}; }
    else if(cur.jung==null){ flush(); cur = {cho:jamo, jung:null, jong:null}; }
    else if(cur.jong==null && !JONG_INCAPABLE.has(jamo)){ cur.jong = jamo; }
    else { flush(); cur = {cho:jamo, jung:null, jong:null}; }
  } else if(isVowel){
    if(!cur){ cur = {cho:null, jung:jamo, jong:null}; }
    else if(cur.jung==null){ cur.jung = jamo; }
    else if(cur.jong!=null){
      const popped = cur.jong; cur.jong = null;
      flush();
      cur = {cho:popped, jung:jamo, jong:null};
    } else {
      const combo = VOWEL_COMBOS[cur.jung+'+'+jamo];
      if(combo){ cur.jung = combo; } else { flush(); cur = {cho:null, jung:jamo, jong:null}; }
    }
  }
  typingComposer.cur = cur;
}
function composerBackspace(){
  const cur = typingComposer.cur;
  if(cur){
    if(cur.jong){ cur.jong = null; }
    else if(cur.jung){ cur.jung = null; }
    else { typingComposer.cur = null; }
  } else if(typingComposer.committed.length){
    typingComposer.committed = typingComposer.committed.slice(0,-1);
  }
}
function composerSpace(){
  if(typingComposer.cur){ typingComposer.committed += composerFlushInto(typingComposer.cur); typingComposer.cur = null; }
  typingComposer.committed += ' ';
}
function composerDisplay(){ return typingComposer.committed + composerFlushInto(typingComposer.cur); }

let typingKeydownHandler = null;
function mountTyping(){
  unmountTyping();
  typingKeydownHandler = function(e){
    if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key==='Backspace'){ e.preventDefault(); composerBackspace(); updateTypingDisplay(); return; }
    if(e.key===' '){ e.preventDefault(); composerSpace(); updateTypingDisplay(); return; }
    if(e.key.length===1 && /[a-zA-Z]/.test(e.key)){
      const lower = e.key.toLowerCase();
      const jamoMapped = e.shiftKey ? (SHIFT_KEY_TO_JAMO[lower]||KEY_TO_JAMO[lower]) : KEY_TO_JAMO[lower];
      if(jamoMapped){ e.preventDefault(); composerKeyPress(jamoMapped); updateTypingDisplay(); }
    }
  };
  window.addEventListener('keydown', typingKeydownHandler);
}
function unmountTyping(){
  if(typingKeydownHandler){ window.removeEventListener('keydown', typingKeydownHandler); typingKeydownHandler=null; }
}
function updateTypingDisplay(){
  const out = document.getElementById('type-output');
  if(!out) return;
  const display = composerDisplay();
  if(view.typingMode==='challenge'){
    const c = TYPING_CHALLENGES[view.typingChallengeIdx];
    const match = !!(c && display === c.kr);
    if(match){
      if(!state.typing.completed.includes(view.typingChallengeIdx)){ state.typing.completed.push(view.typingChallengeIdx); addXp(10); }
      render();
      return;
    }
    out.textContent = display || '\u00a0';
  } else {
    out.textContent = display || 'Click here, then type on your keyboard\u2026';
    out.classList.toggle('placeholder', !display);
  }
}

/* ============================================================
   EXPANSION DATA: PRONUNCIATION SOUND-CHANGE RULES
   The gap that trips up most self-taught learners: Korean is
   NOT read exactly as spelled. These 8 rules cover most of it.
   ============================================================ */
const PRONUNCIATION_RULES = [
  { id:'liaison', name:'Liaison (carrying over)', short:'A final consonant slides into a following empty circle',
    body:'When a syllable ends in a consonant and the next syllable starts with the silent placeholder, that consonant slides over and is pronounced as the next syllable\u2019s first sound. This is the single most common sound change in Korean, and once you hear it, whole sentences suddenly make sense.',
    examples:[
      {spelled:'한국어', sounds:'한구거', rom:'han-gu-geo', note:'the final consonant of the middle block moves right'},
      {spelled:'음악', sounds:'으막', rom:'eu-mak', note:'not "eum-ak"'},
      {spelled:'맛있어요', sounds:'마시써요', rom:'ma-si-sseo-yo', note:'a very common phrase you will hear constantly'},
    ]},
  { id:'h_weak', name:'The disappearing H', short:'H goes quiet between voiced sounds',
    body:'When the H letter sits at the end of a block and the next block begins with the silent placeholder, the H basically vanishes. Korean speakers do not pronounce it, and writing it out as an H is one of the clearest giveaways of a beginner accent.',
    examples:[
      {spelled:'좋아요', sounds:'조아요', rom:'jo-a-yo', note:'never "joh-ah-yo"'},
      {spelled:'많아요', sounds:'마나요', rom:'ma-na-yo', note:'the H drops and the N carries over'},
      {spelled:'싫어요', sounds:'시러요', rom:'si-reo-yo', note:'the H drops and the L/R carries over'},
    ]},
  { id:'aspiration', name:'H merging (aspiration)', short:'H fuses with a neighbor to make an aspirated sound',
    body:'When H bumps directly into G, D, B, or J, the two fuse into the matching aspirated letter. Rather than two separate sounds, you get one puffed sound.',
    examples:[
      {spelled:'축하', sounds:'추카', rom:'chu-ka', note:'G + H fuse into K'},
      {spelled:'좋다', sounds:'조타', rom:'jo-ta', note:'H + D fuse into T'},

const NATIVE_ONES = ['','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉'];
const NATIVE_TENS = ['','열','스물','서른','마흔','쉰','예순','일흔','여든','아흔'];
const NATIVE_ATTRIB = { '하나':'한','둘':'두','셋':'세','넷':'네','스물':'스무' };

function sinoKorean(n){
  if(n===0) return '영';
  if(n>99999999) return null;
  let out = '';
  const units = [[100000000,'억'],[10000,'만'],[1000,'천'],[100,'백'],[10,'십']];
  let rem = n;
  for(const [val,label] of units){
    const count = Math.floor(rem/val);
    if(count>0){
      if(val>=10000){ out += (count===1 && val===10000 ? '' : sinoKorean(count)) + label; }
      else { out += (count===1 ? '' : SINO_ONES[count]) + label; }
      rem = rem % val;
    }
  }
  if(rem>0) out += SINO_ONES[rem];
  return out;
}
function nativeKorean(n){
  if(n<1 || n>99) return null;
  const tens = Math.floor(n/10), ones = n%10;
  return (NATIVE_TENS[tens]||'') + (NATIVE_ONES[ones]||'');
}
function nativeAttributive(n){
  const base = nativeKorean(n);
  if(!base) return null;
  for(const [full, short] of Object.entries(NATIVE_ATTRIB)){
    if(base.endsWith(full)) return base.slice(0, base.length-full.length) + short;
  }
  return base;
}

function addDays(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.toLocaleDateString('en-CA');
}
function srsNewItem(){ return { ease:2.5, interval:0, due:todayStr(), reps:0, lapses:0 }; }

function srsEnsure(key){
  if(!state.srs.items[key]) state.srs.items[key] = srsNewItem();
  return state.srs.items[key];
}
function srsGrade(key, grade){
  const it = srsEnsure(key);
  const today = todayStr();
  if(grade==='again'){
    it.ease = Math.max(1.3, it.ease - 0.2);
    it.interval = 0;
    it.lapses += 1;
    it.reps = 0;
    it.due = today;
  } else if(grade==='hard'){
    it.ease = Math.max(1.3, it.ease - 0.15);
    it.interval = it.interval<=1 ? 1 : Math.round(it.interval*1.2);
    it.reps += 1;
    it.due = addDays(today, it.interval);
  } else if(grade==='good'){
    if(it.reps===0) it.interval = 1;
    else if(it.reps===1) it.interval = 3;
    else it.interval = Math.round(it.interval*it.ease);
    it.reps += 1;
    it.due = addDays(today, it.interval);
  } else if(grade==='easy'){
    it.ease = it.ease + 0.15;
    if(it.reps===0) it.interval = 2;
    else it.interval = Math.round(Math.max(it.interval,1)*it.ease*1.3);
    it.reps += 1;
    it.due = addDays(today, it.interval);
  }
  if(it.interval > 365) it.interval = 365;
  persistState();
}

// Build the full reviewable pool from everything marked known.
function srsPool(){
  const pool = [];
  VOCAB_CATEGORIES.forEach(cat=>cat.words.forEach((w,i)=>{
    const vk = vocabKey(cat.id,i);
    if(state.vocab.known[vk]) pool.push({ key:'v:'+vk, kr:w.kr, rom:w.rom, en:w.en, source:cat.name, type:'word' });
  }));
  PHRASE_SCENARIOS.forEach(scen=>scen.phrases.forEach((p,i)=>{
    const pk = phraseKey(scen.id,i);
    if(state.phrases.known[pk]) pool.push({ key:'p:'+pk, kr:p.kr, rom:p.rom, en:p.en, source:scen.name, type:'phrase' });
  }));
  return pool;
}
function srsDue(){
  const today = todayStr();
  return srsPool().filter(item=>{
    const it = state.srs.items[item.key];
    if(!it) return true; // never reviewed = due now
    return it.due <= today;
  });
}
function srsStats(){
  const pool = srsPool();
  const today = todayStr();
  let neu=0, learning=0, mature=0;
  pool.forEach(item=>{
    const it = state.srs.items[item.key];
    if(!it || it.reps===0) neu++;
    else if(it.interval < 21) learning++;
    else mature++;
  });
  return { total:pool.length, due:srsDue().length, neu, learning, mature };
}

function stageProgress(stage){
  let done=0, total=0;
  stage.milestones.forEach(m=>{
    const [d,t] = m.get(state);
    done += Math.min(d,t); total += t;
  });
  return { done, total, pct: total>0?Math.round((done/total)*100):0, complete: done>=total };
}

/* ---- Dictation / listening ---- */
function dictationPool(){
  const pool = [];
  VOCAB_CATEGORIES.forEach(cat=>cat.words.forEach(w=>pool.push({kr:w.kr,rom:w.rom,en:w.en})));
  return pool;
}
function startDictation(){
  const pool = dictationPool();
  const target = pool[Math.floor(Math.random()*pool.length)];
  const distractors = shuffle(pool.filter(w=>w.kr!==target.kr)).slice(0,3);
  view.dictation = { target, options: shuffle([target,...distractors]), answered:false, selected:null, correct:0, asked:0 };
}
function renderDictation(){
  if(!('speechSynthesis' in window)){
    return '<div class="card card-pad"><h3 style="font-size:16px;margin-bottom:8px;">Listening practice needs speech support</h3><p style="font-size:13.5px;color:var(--ink-soft);">Your browser does not expose a speech synthesizer, so audio drills are unavailable here. Chrome, Edge, and Safari all support it. Everything else in the app still works.</p></div>';
  }
  if(!view.dictation){
    return '<div class="card quiz-stage">'+
      '<h3 style="font-size:17px;margin-bottom:8px;">Listening practice</h3>'+
      '<p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:20px;max-width:48ch;margin-left:auto;margin-right:auto;">You will hear a Korean word with no text shown. Pick what you heard. Training your ear separately from your eyes is what closes the gap between reading and understanding speech.</p>'+
      '<button class="btn btn-celadon" data-action="dictation-start">Start listening drill</button>'+

      '<button class="btn btn-celadon" data-action="speak" data-text="'+d.target.kr+'" style="padding:16px 26px;">'+icon('speaker')+' Play audio</button>'+
      '<p style="font-size:12px;color:var(--ink-soft);margin-top:10px;">Replay as many times as you need.</p>'+
    '</div>'+
    '<div class="quiz-options">'+d.options.map(opt=>{
      let cls='quiz-opt';
      if(d.answered){
        if(opt.kr===d.target.kr) cls+=' correct';
        else if(d.selected && opt.kr===d.selected) cls+=' wrong';
      }
      return '<button class="'+cls+'" '+(d.answered?'':'data-action="dictation-answer" data-kr="'+opt.kr+'"')+'>'+
        '<span class="kr" style="font-size:19px;">'+opt.kr+'</span>'+
        (d.answered?'<div class="mono" style="font-size:11px;color:var(--ink-soft);margin-top:3px;">'+opt.rom+' \u00b7 '+opt.en+'</div>':'')+
      '</button>';

  '</div>';
}

/* ---- Speaking practice (Web Speech API) ---- */
function speechRecognitionAvailable(){
  return typeof window!=='undefined' && (window.SpeechRecognition || window.webkitSpeechRecognition);
}
function renderSpeaking(){
  if(!speechRecognitionAvailable()){
    return '<div class="card card-pad">'+
      '<h3 style="font-size:16px;margin-bottom:8px;">Speech recognition not available in this browser</h3>'+
      '<p style="font-size:13.5px;color:var(--ink-soft);line-height:1.6;">This drill uses the browser\u2019s built-in speech recognition, which currently works in Chrome, Edge, and Safari but not Firefox. If you want to use it, open the app in one of those.</p>'+
      '<p style="font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin-top:10px;">In the meantime, shadowing works without any special support: press play on a phrase anywhere in the app and speak along with it, matching the rhythm rather than individual sounds.</p>'+
    '</div>';
  }
  const sp = view.speaking || { idx:0, status:'idle', heard:'', result:null };
  const pool = PHRASE_SCENARIOS.flatMap(s=>s.phrases);
  const target = pool[sp.idx % pool.length];
  let feedback = '';
  if(sp.result==='match') feedback = '<div class="tag tag-celadon" style="margin-bottom:10px;">Matched</div>';
  else if(sp.result==='close') feedback = '<div class="tag tag-gold" style="margin-bottom:10px;">Close</div>';
  else if(sp.result==='miss') feedback = '<div class="tag tag-seal" style="margin-bottom:10px;">Not quite</div>';

  return '<div class="card quiz-stage">'+
    '<p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;">Say this out loud:</p>'+
    '<div class="kr" style="font-size:28px;font-weight:700;margin-bottom:6px;line-height:1.4;">'+target.kr+'</div>'+
    '<div class="mono" style="font-size:13px;color:var(--celadon-deep);margin-bottom:6px;">'+target.rom+'</div>'+
    '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:18px;">'+target.en+'</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;">'+
      '<button class="audio-btn" data-action="speak" data-text="'+target.kr+'">'+icon('speaker')+'</button>'+
      '<button class="btn '+(sp.status==='listening'?'btn-seal':'btn-celadon')+'" data-action="speak-record">'+(sp.status==='listening'?'Listening\u2026 tap to stop':'Tap and speak')+'</button>'+
    '</div>'+
    (sp.heard?'<div style="margin-bottom:14px;">'+feedback+'<p style="font-size:12.5px;color:var(--ink-soft);">Heard: <span class="kr" style="font-size:16px;color:var(--ink);">'+escapeHtml(sp.heard)+'</span></p></div>':'')+

  '</div>';
