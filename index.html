/* ---- Sentence builder ---- */
function startSentenceDrill(){
  const idx = Math.floor(Math.random()*SENTENCE_DRILLS.length);
  const drill = SENTENCE_DRILLS[idx];
  view.sentence = { idx, pool: shuffle(drill.chunks.map((c,i)=>({c,i}))), placed:[], checked:false };
}
function renderSentenceBuilder(){
  if(!view.sentence) startSentenceDrill();
  const s = view.sentence;
  const drill = SENTENCE_DRILLS[s.idx];
  const correctOrder = drill.chunks;
  const isComplete = s.placed.length === correctOrder.length;
  const isCorrect = isComplete && s.placed.every((p,i)=>p.c===correctOrder[i]);

  return '<div class="card card-pad">'+
    '<div class="section-eyebrow">Build this sentence</div>'+
    '<h3 style="font-size:19px;margin-bottom:6px;">'+drill.en+'</h3>'+
    '<p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;">Tap the pieces in the right order. Remember: the verb goes last.</p>'+

    '<div style="min-height:62px;border:2px dashed '+(s.checked?(isCorrect?'var(--celadon)':'var(--seal)'):'var(--border)')+';border-radius:var(--radius-md);padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;background:var(--surface-2);">'+
      (s.placed.length===0?'<span style="font-size:13px;color:var(--ink-faint);">Your sentence appears here</span>':
        s.placed.map((p,i)=>'<button class="chip-opt sel" data-action="sentence-unplace" data-pos="'+i+'" style="font-size:15px;">'+p.c+'</button>').join(''))+
    '</div>'+

    '<div class="chip-select" style="margin-bottom:18px;">'+
      s.pool.filter(p=>!s.placed.some(pl=>pl.i===p.i)).map(p=>'<button class="chip-opt" data-action="sentence-place" data-i="'+p.i+'" style="font-size:15px;">'+p.c+'</button>').join('')+
    '</div>'+

    (s.checked
      ? '<div class="gram-example" style="margin-bottom:14px;">'+
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;"><span class="tag '+(isCorrect?'tag-celadon':'tag-seal')+'">'+(isCorrect?'Correct':'Not quite')+'</span></div>'+
          '<div class="gram-ex-kr kr">'+correctOrder.join(' ')+'</div>'+
          '<div class="gram-ex-rom mono">'+drill.rom+'</div>'+
          '<div class="gram-ex-en">'+drill.note+'</div>'+
        '</div>'
      : '')+

    '<div style="display:flex;gap:10px;flex-wrap:wrap;">'+
      (s.checked
        ? '<button class="btn btn-celadon" data-action="sentence-next">Next sentence</button>'
        : '<button class="btn btn-celadon" data-action="sentence-check" '+(isComplete?'':'disabled')+'>Check answer</button>')+
      '<button class="btn btn-outline" data-action="sentence-reset">Reset</button>'+
    '</div>'+
  '</div>';
}

/* ---- Number trainer ---- */
function startNumberDrill(){
  const useNative = Math.random()<0.5;
  const n = useNative ? (1+Math.floor(Math.random()*99)) : (1+Math.floor(Math.random()*9999));
  const answer = useNative ? nativeKorean(n) : sinoKorean(n);
  const distract = new Set();
  let guard = 0;
  while(distract.size<3 && guard<60){
    guard++;
    const m = useNative ? (1+Math.floor(Math.random()*99)) : (1+Math.floor(Math.random()*9999));
    const a = useNative ? nativeKorean(m) : sinoKorean(m);
    if(a && a!==answer) distract.add(a);
  }
  view.numbers = { n, useNative, answer, options: shuffle([answer,...Array.from(distract)]), answered:false, selected:null,
                   correct: (view.numbers&&view.numbers.correct)||0, asked: (view.numbers&&view.numbers.asked)||0 };
}
function renderNumberTrainer(){
  if(!view.numbers) startNumberDrill();
  const q = view.numbers;
  return ''+
  '<div class="card quiz-stage" style="margin-bottom:18px;">'+
    '<div class="tag '+(q.useNative?'tag-gold':'tag-celadon')+'" style="margin-bottom:14px;">'+(q.useNative?'Native Korean':'Sino-Korean')+'</div>'+
    '<div style="font-size:52px;font-weight:700;font-family:var(--font-display);line-height:1;margin-bottom:8px;">'+q.n.toLocaleString()+'</div>'+
    '<div class="quiz-prompt-sub">How do you say this using '+(q.useNative?'native Korean':'Sino-Korean')+' numbers?</div>'+
    '<div class="quiz-options">'+q.options.map(opt=>{
      let cls='quiz-opt';
      if(q.answered){
        if(opt===q.answer) cls+=' correct';
        else if(opt===q.selected) cls+=' wrong';
      }
      return '<button class="'+cls+' kr" '+(q.answered?'':'data-action="number-answer" data-val="'+opt+'"')+' style="font-size:17px;">'+opt+'</button>';
    }).join('')+'</div>'+
    '<div class="quiz-score-line">Correct: '+q.correct+' / '+q.asked+'</div>'+
    (q.answered?'<div style="display:flex;gap:10px;justify-content:center;margin-top:16px;"><button class="audio-btn" data-action="speak" data-text="'+q.answer+'">'+icon('speaker')+'</button><button class="btn btn-primary" data-action="number-next">Next number</button></div>':'')+
  '</div>'+
  '<div class="card card-pad">'+
    '<h3 style="font-size:15px;margin-bottom:6px;">Which system do I use?</h3>'+

    '<div class="card" style="box-shadow:none;border:1px solid var(--border-soft);">'+
      COUNTERS.map(c=>'<div class="item-row" style="padding:11px 14px;">'+
        '<div style="width:44px;flex-shrink:0;"><span class="kr" style="font-size:19px;font-weight:700;">'+c.counter+'</span></div>'+
        '<div class="item-main"><div style="font-size:13.5px;font-weight:600;">'+c.use+'</div><div class="item-rom">'+c.example+' \u00b7 '+c.rom+'</div><div class="item-en">'+c.en+'</div></div>'+
        '<span class="tag '+(c.system==='native'?'tag-gold':'tag-celadon')+'">'+(c.system==='native'?'Native':'Sino')+'</span>'+
      '</div>').join('')+

/* ---- Conjugation drill ---- */
function startConjDrill(){
  const verb = CONJUGATIONS[Math.floor(Math.random()*CONJUGATIONS.length)];
  const form = CONJ_FORMS[Math.floor(Math.random()*CONJ_FORMS.length)];
  const answer = verb[form.id];
  const distract = new Set();
  let guard=0;
  while(distract.size<3 && guard<80){
    guard++;
    const v = CONJUGATIONS[Math.floor(Math.random()*CONJUGATIONS.length)];
    const f = CONJ_FORMS[Math.floor(Math.random()*CONJ_FORMS.length)];
    const a = v[f.id];
    if(a && a!==answer) distract.add(a);
  }
  view.conj = { verb, form, answer, options: shuffle([answer,...Array.from(distract)]), answered:false, selected:null,
                correct:(view.conj&&view.conj.correct)||0, asked:(view.conj&&view.conj.asked)||0 };
}

/* ============================================================

   ============================================================ */
let activeRecognition = null;
function normalizeKo(s){ return String(s||'').replace(/[\s.,!?~"'\u2018\u2019\u201c\u201d]/g,''); }
function startSpeechRecognition(){
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Ctor) return;
  if(activeRecognition){ try{ activeRecognition.stop(); }catch(e){} activeRecognition=null; }
  if(!view.speaking) view.speaking = { idx:0, status:'idle', heard:'', result:null };

  const pool = PHRASE_SCENARIOS.flatMap(s=>s.phrases);
  const target = pool[view.speaking.idx % pool.length];

  const rec = new Ctor();
  rec.lang = 'ko-KR';
  rec.interimResults = false;
  rec.maxAlternatives = 3;
  activeRecognition = rec;
  view.speaking.status = 'listening';
  view.speaking.heard = '';
  view.speaking.result = null;
  render();

  rec.onresult = function(e){
    let best = '';
    let outcome = 'miss';
    const goal = normalizeKo(target.kr);
    for(let i=0;i<e.results[0].length;i++){
      const alt = e.results[0][i].transcript;
      const norm = normalizeKo(alt);
      if(!best) best = alt;
      if(norm===goal){ best = alt; outcome = 'match'; break; }
      if(outcome!=='match' && (norm.includes(goal) || goal.includes(norm)) && norm.length>1){ best = alt; outcome = 'close'; }
    }
    view.speaking.heard = best;
    view.speaking.result = outcome;
    view.speaking.status = 'idle';
    if(outcome==='match') addXp(5);
    render();
  };
  rec.onerror = function(){
    view.speaking.status='idle';
    view.speaking.heard='';
    view.speaking.result=null;
    render();
    showToast('Microphone issue', 'Could not capture audio. Check mic permission.', 'speakerOff');
  };
  rec.onend = function(){
    if(view.speaking && view.speaking.status==='listening'){ view.speaking.status='idle'; render(); }
    activeRecognition = null;
  };
  try{ rec.start(); }catch(e){ view.speaking.status='idle'; render(); }
}
function stopSpeechRecognition(){
  if(activeRecognition){ try{ activeRecognition.stop(); }catch(e){} activeRecognition=null; }
  if(view.speaking){ view.speaking.status='idle'; render(); }
}

/* ============================================================
   EVENT DELEGATION (expansion actions)
   Added as a second listener so the original dispatcher stays
   untouched; unknown actions simply fall through both.
   ============================================================ */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');

  switch(action){
    case 'set-goal':
      ensureDailyGoal();
      state.daily.target = parseInt(el.getAttribute('data-target'),10)||30;
      persistState(); render();
      break;

    /* pronunciation */
    case 'pron-open': view.pronRule = el.getAttribute('data-id'); render(); break;
    case 'pron-back': view.pronRule = null; render(); break;
    case 'pron-learn': {
      const id = el.getAttribute('data-id');
      if(!state.pronunciation.learned.includes(id)){ state.pronunciation.learned.push(id); addXp(10); }
      else { state.pronunciation.learned = state.pronunciation.learned.filter(x=>x!==id); persistState(); }
      render();
      break;
    }

    /* irregulars */
    case 'irr-learn': {
      const id = el.getAttribute('data-id');
      if(!state.irregulars.learned.includes(id)){ state.irregulars.learned.push(id); addXp(10); }
      else { state.irregulars.learned = state.irregulars.learned.filter(x=>x!==id); persistState(); }
      render();
      break;
    }

    /* practice tabs */
    case 'practice-tab':
      view.practiceTab = el.getAttribute('data-tab');
      view.srsSession=null; view.dictation=null; view.sentence=null;
      render();
      break;

    /* SRS */
    case 'srs-start': {
      const due = shuffle(srsDue());
      view.srsSession = { queue: due, idx:0, revealed:false, cram:false };
      render();
      break;
    }
    case 'srs-cram': {
      const all = shuffle(srsPool()).slice(0,20);
      view.srsSession = { queue: all, idx:0, revealed:false, cram:true };
      render();
      break;
    }
    case 'srs-reveal': view.srsSession.revealed = true; render(); break;
    case 'srs-grade': {
      const sess = view.srsSession;
      const item = sess.queue[sess.idx];
      const grade = el.getAttribute('data-grade');
      if(!sess.cram){ srsGrade(item.key, grade); }
      if(grade!=='again') addXp(2);
      sess.idx++; sess.revealed=false;
      render();
      break;
    }
    case 'srs-end': view.srsSession=null; render(); break;

    /* dictation */
    case 'dictation-start': startDictation(); render(); break;
    case 'dictation-answer': {
      const d = view.dictation;
      if(d.answered) break;
      d.selected = el.getAttribute('data-kr');
      d.answered = true;
      d.asked++;
      if(d.selected===d.target.kr){ d.correct++; addXp(3); }
      render();
      break;
    }
    case 'dictation-next': {
      const prev = view.dictation;
      startDictation();
      view.dictation.correct = prev.correct; view.dictation.asked = prev.asked;
      render();
      setTimeout(()=>{ if(view.dictation && view.dictation.target) speak(view.dictation.target.kr); }, 250);
      break;
    }

    /* speaking */
    case 'speak-record': {
      if(view.speaking && view.speaking.status==='listening') stopSpeechRecognition();
      else startSpeechRecognition();
      break;
    }
    case 'speak-next': {
      if(!view.speaking) view.speaking = { idx:0, status:'idle', heard:'', result:null };
      view.speaking.idx++; view.speaking.heard=''; view.speaking.result=null; view.speaking.status='idle';
      render();
      break;
    }

    /* sentence builder */
    case 'sentence-place': {
      const i = parseInt(el.getAttribute('data-i'),10);
      const chunk = view.sentence.pool.find(p=>p.i===i);
      if(chunk) view.sentence.placed.push(chunk);
      render();
      break;
    }
    case 'sentence-unplace': {
      const pos = parseInt(el.getAttribute('data-pos'),10);
      view.sentence.placed.splice(pos,1);
      view.sentence.checked = false;
      render();
      break;
    }
    case 'sentence-check': {
      const s = view.sentence;
      const drill = SENTENCE_DRILLS[s.idx];
      s.checked = true;
      const ok = s.placed.every((p,i)=>p.c===drill.chunks[i]) && s.placed.length===drill.chunks.length;
      if(ok) addXp(5);
      render();
      break;
    }
    case 'sentence-next': startSentenceDrill(); render(); break;
    case 'sentence-reset': view.sentence.placed=[]; view.sentence.checked=false; render(); break;

    /* numbers */
    case 'number-answer': {
      const q = view.numbers;
      if(q.answered) break;
      q.selected = el.getAttribute('data-val');
      q.answered = true; q.asked++;
      if(q.selected===q.answer){ q.correct++; addXp(3); }
      render();
      break;
    }
    case 'number-next': startNumberDrill(); render(); break;

    /* conjugation */
    case 'conj-answer': {
      const q = view.conj;
      if(q.answered) break;
      q.selected = el.getAttribute('data-val');
      q.answered = true; q.asked++;
      if(q.selected===q.answer){ q.correct++; addXp(3); }
      render();
      break;
    }
    case 'conj-next': startConjDrill(); render(); break;

    /* vocab / grammar subtabs */
    case 'vocab-tab': view.vocabTab = el.getAttribute('data-tab'); view.vocabCat=null; render(); break;
    case 'grammar-tab': view.grammarTab = el.getAttribute('data-tab'); view.grammarLesson=null; render(); break;
  }
});

    case 'hangul-open': view.hangulDetail = el.getAttribute('data-id'); render(); break;
    case 'hangul-back': view.hangulDetail = null; render(); break;
    case 'hangul-learn': {
      const id = el.getAttribute('data-id');
      if(!state.hangul.learned.includes(id)){ state.hangul.learned.push(id); addXp(5); }
      else { state.hangul.learned = state.hangul.learned.filter(x=>x!==id); persistState(); }
      render();
      break;
    }
    case 'builder-set': {
      if(!view.builder) view.builder = { cho:'ㄱ', jung:'ㅏ', jong:'' };
      view.builder[el.getAttribute('data-slot')] = el.getAttribute('data-val');
      if(!state.hangul.builderUsed){ state.hangul.builderUsed = true; addXp(5); }
      render();
      break;
    }
    case 'stroke-replay': mountStrokeAnimation(); break;
    case 'stroke-clear': clearTraceCanvas(); break;

    case 'quiz-start': startHangulQuiz(); render(); break;
    case 'quiz-answer': answerQuiz(el.getAttribute('data-rom')); break;
    case 'quiz-next': nextQuizQuestion(); break;

    case 'speak': speak(el.getAttribute('data-text')); break;

    case 'vocab-open': view.vocabCat = el.getAttribute('data-cat'); view.vocabMode='list'; view.flashIdx=0; view.flashFlipped=false; render(); break;
    case 'vocab-back': view.vocabCat = null; render(); break;
    case 'vocab-mode': view.vocabMode = el.getAttribute('data-mode'); view.flashIdx=0; view.flashFlipped=false; render(); break;
    case 'vocab-toggle-known': {
      const key = vocabKey(el.getAttribute('data-cat'), el.getAttribute('data-idx'));
      const wasKnown = !!state.vocab.known[key];
      state.vocab.known[key] = !wasKnown;
      if(!wasKnown) addXp(3); else persistState();
      render();
      break;
    }
    case 'vocab-restart-flash': view.flashIdx = 0; view.flashFlipped=false; render(); break;
    case 'flash-flip': view.flashFlipped = !view.flashFlipped; render(); break;
    case 'flash-mark': {
      const cat = VOCAB_CATEGORIES.find(c=>c.id===view.vocabCat);
      const key = vocabKey(cat.id, view.flashIdx);
      const markKnown = el.getAttribute('data-known')==='1';
      const wasKnown = !!state.vocab.known[key];
      state.vocab.known[key] = markKnown;
      view.flashIdx++; view.flashFlipped=false;
      if(markKnown && !wasKnown) addXp(3); else persistState();
      render();
      break;
    }

    case 'phrase-open': view.phraseScenario = el.getAttribute('data-scen'); render(); break;
    case 'phrase-back': view.phraseScenario = null; render(); break;
    case 'phrase-toggle-known': {
      const key = phraseKey(el.getAttribute('data-scen'), el.getAttribute('data-idx'));
      const wasKnown = !!state.phrases.known[key];
      state.phrases.known[key] = !wasKnown;
      if(!wasKnown) addXp(3); else persistState();
      render();
      break;
    }

    case 'grammar-open': view.grammarLesson = el.getAttribute('data-id'); render(); break;
    case 'grammar-back': view.grammarLesson = null; render(); break;
    case 'grammar-complete': {
      const id = el.getAttribute('data-id');
      if(!state.grammar.completed.includes(id)){ state.grammar.completed.push(id); addXp(15); }
      else { state.grammar.completed = state.grammar.completed.filter(x=>x!==id); persistState(); }
      render();
      break;
    }

    case 'typing-mode': view.typingMode = el.getAttribute('data-mode'); typingComposer = {committed:'',cur:null}; render(); break;
    case 'typing-clear': typingComposer = {committed:'',cur:null}; render(); break;
    case 'typing-challenge-next': view.typingChallengeIdx++; typingComposer = {committed:'',cur:null}; render(); break;
    case 'typing-challenge-restart': view.typingChallengeIdx = 0; typingComposer = {committed:'',cur:null}; render(); break;

    case 'reading-open': view.readingPassage = el.getAttribute('data-id'); render(); break;
    case 'reading-back': view.readingPassage = null; render(); break;
    case 'reading-toggle': view[el.getAttribute('data-field')] = !view[el.getAttribute('data-field')]; render(); break;
    case 'reading-complete': {
      const id = el.getAttribute('data-id');
      if(!state.reading.completed.includes(id)){ state.reading.completed.push(id); addXp(20); }
      else { state.reading.completed = state.reading.completed.filter(x=>x!==id); persistState(); }
      render();
      break;
    }
  }
});

/* ============================================================
   V3 THEME
   Three user choices (auto / light / dark) collapse to one
   resolved attribute on <html>, so CSS only ever has to know
   about data-theme="light" or data-theme="dark". Canvas drawing
   reads live token values through cssVar() for the same reason.
   ============================================================ */
const THEME_CHOICES = [
  { id:'auto',  label:'Auto',  icon:'contrast' },
  { id:'light', label:'Light', icon:'sun' },
  { id:'dark',  label:'Dark',  icon:'moon' },
];
function themeChoice(){
  const t = state.settings && state.settings.theme;
  return THEME_CHOICES.some(c=>c.id===t) ? t : 'auto';
}
function prefersDark(){
  try{ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  catch(e){ return false; }
}
function resolvedTheme(){
  const c = themeChoice();
  return c==='auto' ? (prefersDark() ? 'dark' : 'light') : c;
}
function applyTheme(){
  const t = resolvedTheme();
  document.documentElement.setAttribute('data-theme', t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t==='dark' ? '#0E1719' : '#EDF2EE');
  /* Mirror the choice for the pre-paint script in <head>. */
  try{ localStorage.setItem('hangeul-path-theme', themeChoice()); }catch(e){}
}
function setTheme(choice){
  state.settings.theme = choice;
  applyTheme();
  persistState();
  render();
}
/* Follow the OS only while the user is on "auto". */
(function watchSystemTheme(){
  try{
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = ()=>{ if(themeChoice()==='auto'){ applyTheme(); render(); } };
    if(mq.addEventListener) mq.addEventListener('change', onChange);
    else if(mq.addListener) mq.addListener(onChange);
  }catch(e){ /* matchMedia unavailable */ }
})();
/* Live token lookup, for <canvas> which cannot use CSS variables. */
function cssVar(name, fallback){
  try{
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }catch(e){ return fallback; }
}

/* ============================================================

function audioRate(){ return (state.settings && state.settings.slowAudio) ? 0.7 : 0.92; }
function speak(text, rateOverride){
  if(!('speechSynthesis' in window)) return null;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    if(koreanVoice) u.voice = koreanVoice;
    u.rate = rateOverride || audioRate();
    window.speechSynthesis.speak(u);
    return u;
  }catch(e){ return null; }
}

let audioCtx = null, lastSfxAt = 0;
function sfx(kind){
  if(!state.settings || !state.settings.sound) return;
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    audioCtx = audioCtx || new Ctx();
    const tones = {
      correct:[[880,0,0.09],[1318.5,0.07,0.16]],
      levelup:[[523.25,0,0.14],[659.25,0.11,0.14],[783.99,0.22,0.14],[1046.5,0.33,0.32]],
      achieve:[[659.25,0,0.12],[987.77,0.1,0.24]],
      bell:[[1046.5,0,0.9],[1568,0.01,0.7],[2093,0.02,0.4]],
    }[kind] || [];
    const t0 = audioCtx.currentTime;
    tones.forEach(([f,delay,dur])=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0+delay);
      g.gain.exponentialRampToValueAtTime(kind==='bell'?0.09:0.11, t0+delay+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+delay+dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0+delay); o.stop(t0+delay+dur+0.05);
    });
  }catch(e){ /* audio unavailable */ }
}

function confetti(){
  try{
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let cv = document.getElementById('confetti-canvas');
    if(!cv){ cv = document.createElement('canvas'); cv.id='confetti-canvas'; document.body.appendChild(cv); }
    const ctx = cv.getContext && cv.getContext('2d');
    if(!ctx) return;
    cv.width = window.innerWidth; cv.height = window.innerHeight;
    const colors = [cssVar('--celadon','#4C9186'), cssVar('--gold','#B08A3E'), cssVar('--seal','#C3402C'), cssVar('--celadon-deep','#356F63'), cssVar('--gold-bright','#C9A353')];
    const parts = Array.from({length:130}, ()=>({ x:cv.width/2+(Math.random()-0.5)*220, y:cv.height*0.32, vx:(Math.random()-0.5)*13, vy:-Math.random()*13-4, r:Math.random()*7+4, c:colors[Math.floor(Math.random()*colors.length)], rot:Math.random()*6, vr:(Math.random()-0.5)*0.3 }));
    const start = performance.now();
    (function frame(t){
      const el = t-start;
      ctx.clearRect(0,0,cv.width,cv.height);
      parts.forEach(p=>{ p.vy+=0.36; p.vx*=0.99; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.max(0,1-el/2400); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/3,p.r,p.r*0.6); ctx.restore(); });
      if(el<2400) requestAnimationFrame(frame); else ctx.clearRect(0,0,cv.width,cv.height);
    })(start);
  }catch(e){}
}

function ensureDailyGoal(){
  const today = todayStr();
  if(state.daily.date !== today){ state.daily.date = today; state.daily.xp = 0; state.daily.counters = {}; state.daily.questsDone = []; }
  if(!state.daily.counters) state.daily.counters = {};
  if(!state.daily.questsDone) state.daily.questsDone = [];
}
function addXp(amount){
  const before = levelFromXp(state.xp).level;
  ensureDailyGoal();
  const target = state.daily.target || 30;
  const hadGoal = state.daily.xp >= target;
  state.xp += amount;
  state.daily.xp += amount;
  logHistory('xp', amount);
  const after = levelFromXp(state.xp).level;
  if(after>before){ showToast('Level '+after+'!', 'You leveled up. Keep going.', 'star'); sfx('levelup'); confetti(); }
  else if(Date.now()-lastSfxAt>160){ sfx('correct'); lastSfxAt = Date.now(); }
  if(!hadGoal && state.daily.xp >= target){ showToast('Daily goal reached', 'That is a day well spent.', 'target'); if(after===before) confetti(); }
  checkAchievements();
  checkQuests();
  persistState();
}
function checkAchievements(){

}

/* ============================================================
   V3 DAILY QUESTS
   ============================================================ */
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function seededPick(arr, n, seed){
  const a = arr.slice(); let s = seed||1;
  for(let i=a.length-1;i>0;i--){ s=(Math.imul(s,1103515245)+12345)>>>0; const j=s%(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a.slice(0,n);
}
function todaysQuests(){
  const deck = srsStats().total;
  const pool = QUEST_DEFS.filter(q=>q.id!=='minutes' && (!q.needsDeck || deck>=10));
  return [QUEST_DEFS[0]].concat(seededPick(pool, 2, hashStr(todayStr())));
}
function questValue(q){
  ensureDailyGoal();
  if(q.key==='minutes') return minutesOn(todayStr());
  return Math.floor(state.daily.counters[q.key]||0);
}
function bumpCounter(key, n){ ensureDailyGoal(); state.daily.counters[key] = (state.daily.counters[key]||0) + (n||1); checkQuests(); persistState(); }
function checkQuests(){
  ensureDailyGoal();
  const qs = todaysQuests(); let newly = 0;
  qs.forEach(q=>{
    if(!state.daily.questsDone.includes(q.id) && questValue(q)>=q.goal){
      state.daily.questsDone.push(q.id); newly++;
      state.xp += 15; state.daily.xp += 15; logHistory('xp',15);
      showToast('Quest complete', q.label+' (+15 XP)', 'check'); sfx('achieve');
    }
  });
  if(newly && qs.every(q=>state.daily.questsDone.includes(q.id))){
    state.stats.perfectDays = (state.stats.perfectDays||0)+1;
    setTimeout(()=>{ showToast('All daily quests done', 'Come back tomorrow for three new ones.', 'trophy'); confetti(); }, 500);
    checkAchievements();
  }
  if(newly){ persistState(); if(currentSection==='dashboard') render(); }
}
let lastQuestCheckAt = 0;
function checkQuestsThrottled(){ if(Date.now()-lastQuestCheckAt>5000){ lastQuestCheckAt=Date.now(); checkQuests(); } }

/* ============================================================
   V3 SESSION TIMER
   Uses real clock deltas so it stays accurate even when the
   browser throttles background tabs. Keeps running across pages.
   ============================================================ */
function currentPlan(){ return state.timer && SESSION_PLANS.find(p=>p.id===state.timer.planId); }
function fmtTime(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function startSession(planId){
  const plan = SESSION_PLANS.find(p=>p.id===planId); if(!plan) return;
  state.timer = { active:true, running:true, planId, segIdx:0, remaining:plan.segs[0].min*60, lastTick:Date.now() };
  const k = SEG_KINDS[plan.segs[0].kind];
  showToast('Session started', 'First up: '+k.label+'. '+k.tip, 'timer');
  persistState(); render();
}
function toggleTimer(){ const t = state.timer; if(!t || !t.active) return; t.running = !t.running; t.lastTick = Date.now(); persistState(); render(); }
function endSession(){ state.timer = { active:false, running:false, planId:null, segIdx:0, remaining:0, lastTick:null }; persistState(); render(); }
function advanceSegment(skipped){
  const t = state.timer, plan = currentPlan();
  if(!plan) return endSession();
  if(t.segIdx+1 >= plan.segs.length){
    state.sessionsCompleted = (state.sessionsCompleted||0)+1;
    sfx('bell'); confetti();
    showToast('Session complete', 'You finished a '+plan.minutes+'-minute session. +20 XP', 'trophy');
    state.timer = { active:false, running:false, planId:null, segIdx:0, remaining:0, lastTick:null };
    addXp(20); render(); return;
  }
  t.segIdx++; t.remaining = plan.segs[t.segIdx].min*60; t.lastTick = Date.now();
  const k = SEG_KINDS[plan.segs[t.segIdx].kind];
  if(!skipped){ sfx('bell'); showToast('Next: '+k.label, plan.segs[t.segIdx].min+' min. '+k.tip, 'timer'); }
  persistState(); render();
}
let lastPersistAt = 0;
function timerTick(){
  const t = state.timer;
  if(!t || !t.active || !t.running) return;
  const now = Date.now();
  let delta = (now - (t.lastTick||now))/1000;
  t.lastTick = now;
  if(delta<0) delta = 0;
  if(delta>120) delta = 120; // ignore long sleeps (closed laptop, etc.)
  t.remaining -= delta;
  logHistory('secs', delta);
  checkQuestsThrottled();
  if(t.remaining<=0){ advanceSegment(false); return; }
  updateTimerDom();
  if(now-lastPersistAt>15000){ lastPersistAt = now; persistState(); }
}
function updateTimerDom(){
  const t = state.timer, plan = currentPlan();
  if(!plan) return;
  const seg = plan.segs[t.segIdx];
  document.querySelectorAll('[data-timer="time"]').forEach(el=>{ el.textContent = fmtTime(t.remaining); });
  document.querySelectorAll('[data-timer="today-min"]').forEach(el=>{ el.textContent = String(minutesOn(todayStr())); });
  const ring = document.getElementById('timer-ring-fg');
  if(ring){
    const C = 2*Math.PI*88, frac = Math.min(1, Math.max(0, 1 - t.remaining/(seg.min*60)));
    ring.style.strokeDasharray = String(C);
    ring.style.strokeDashoffset = String(C*(1-frac));
  }
}
function goToSegment(kind){
  const k = SEG_KINDS[kind];
  if(!k) return;
  if(!k.section){
    const rec = nextRecommendation(computeTotals());
    navigate(rec.section==='practice' || rec.section==='progress' ? 'vocab' : rec.section);
    return;
  }
  navigate(k.section);
  if(k.tab){ view[k.tabKey] = k.tab; render(); }
}
function renderTimerWidget(){
  const t = state.timer;
  if(!t || !t.active || currentSection==='dashboard') return '';
  const plan = currentPlan(); if(!plan) return '';
  const k = SEG_KINDS[plan.segs[t.segIdx].kind];
  return '<div class="timer-widget" data-action="nav" data-section="dashboard" title="Open today\u2019s session">'+
    '<div><div class="tw-seg">'+k.label+' \u00b7 '+(t.segIdx+1)+'/'+plan.segs.length+(t.running?'':' \u00b7 paused')+'</div><div class="tw-time" data-timer="time">'+fmtTime(t.remaining)+'</div></div>'+
    '<div style="display:flex;gap:6px;">'+
      '<button class="tw-btn" data-action="timer-toggle" aria-label="'+(t.running?'Pause':'Resume')+'">'+icon(t.running?'pause':'play')+'</button>'+
      '<button class="tw-btn" data-action="timer-skip" aria-label="Next segment">'+icon('skip')+'</button>'+
    '</div></div>';
}

/* ============================================================
   V3 YOUTUBE HELPERS
   ============================================================ */
function ytIdFromUrl(url){
  const s = String(url||'').trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  const m = s.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function ytSearchUrl(q){ return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q); }
function ytWatchUrl(id){ return 'https://www.youtube.com/watch?v='+id; }

/* Opened straight from disk, the page's origin is "null". YouTube refuses
   to serve an embed to a null origin, so the player would sit there blank
   no matter what we do to the iframe. Detect it and say so plainly instead. */
function isFileOrigin(){ return location.protocol === 'file:'; }

function ytEmbedUrl(id){
  const params = [
    'rel=0',                 // keep related videos inside the same channel
    'autoplay=1',            // allowed: mounting always follows a click
    'playsinline=1',         // iOS must not hijack into fullscreen
    'modestbranding=1',
    'enablejsapi=1',
  ];
  /* origin= is required by the JS API, but it must be a real origin;
     sending "null" from a file:// page makes YouTube reject the frame. */
  if(!isFileOrigin()) params.push('origin=' + encodeURIComponent(location.origin));
  return 'https://www.youtube-nocookie.com/embed/' + id + '?' + params.join('&');
}

/* ------------------------------------------------------------
   PERSISTENT PLAYER HOST

   render() rebuilds #app's innerHTML wholesale, so an <iframe>
   written into a section template is destroyed and recreated on
   every state change: marking the lesson watched, a timer tick
   that ends a segment, adding a video. The player reloaded and
   the lesson jumped back to 0:00, which is what made embedded
   video feel broken.

   Re-parenting an iframe reloads it too, so the player cannot
   simply be moved back into place after a render. Instead it
   lives in its own element outside #app, which render() never
   touches, and is positioned over the slot the section leaves
   for it.
   ------------------------------------------------------------ */
let ytHost = null;
function ytHostEl(){
  if(ytHost && ytHost.isConnected) return ytHost;
  ytHost = document.createElement('div');
  ytHost.id = 'yt-host';
  ytHost.hidden = true;
  document.body.appendChild(ytHost);
  return ytHost;
}
function ytMount(id, title){
  const host = ytHostEl();
  if(host.dataset.vid === id) return;   // already this video: leave it playing
  host.dataset.vid = id;
  host.innerHTML =
    '<iframe src="'+ytEmbedUrl(id)+'" title="'+escapeHtml(title||'Video')+'" '+
    'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" '+
    'allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
}
function ytUnmount(){
  if(!ytHost) return;
  ytHost.dataset.vid = '';
  ytHost.innerHTML = '';          // stops playback; no audio left running offscreen
  ytHost.hidden = true;
}
function ytPosition(slot){
  const host = ytHostEl();
  const r = slot.getBoundingClientRect();
  if(r.width < 1 || r.height < 1){ host.hidden = true; return; }
  host.hidden = false;
  host.style.width = r.width + 'px';
  host.style.height = r.height + 'px';
  host.style.transform = 'translate(' + (r.left + window.scrollX) + 'px,' + (r.top + window.scrollY) + 'px)';
}
/* Called after every render: mounts, moves or tears down the player to
   match whatever the freshly drawn section is asking for. */
function syncVideoHost(){
  const slot = document.getElementById('yt-slot');
  const want = slot && slot.getAttribute('data-vid');
  if(!want){ ytUnmount(); return; }
  ytMount(want, slot.getAttribute('data-title'));
  ytPosition(slot);
}
(function watchVideoLayout(){
  const resync = ()=>{ if(ytHost && ytHost.dataset.vid) syncVideoHost(); };
  window.addEventListener('resize', resync);
  /* The section fades in with a translate, so the slot's final position is
     only known once that animation settles. */
  document.addEventListener('animationend', e=>{
    if(e.target && e.target.id === 'main-inner') resync();
  }, true);
  try{ new ResizeObserver(resync).observe(document.body); }catch(e){ /* older browser */ }
})();

/* ============================================================
   V3 BACKUP / RESTORE
   ============================================================ */
function exportProgress(){
  try{
    const blob = new Blob([JSON.stringify(state,null,1)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'hangeul-path-backup-'+todayStr()+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    showToast('Backup saved', 'Keep this file somewhere safe.', 'download');
  }catch(e){ showToast('Backup failed', 'Your browser blocked the download.', 'download'); }
}
function importProgress(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(typeof parsed!=='object' || typeof parsed.xp!=='number') throw new Error('bad file');
      const def = defaultState();
      state = Object.assign(def, parsed);
      Object.keys(def).forEach(k=>{ const d = defaultState()[k]; if(d && typeof d==='object' && !Array.isArray(d)) state[k] = Object.assign(d, parsed[k]||{}); });
      persistState(); render();
      showToast('Progress restored', 'Welcome back.', 'upload');
    }catch(e){ showToast('Could not restore', 'That file is not a Hangeul Path backup.', 'upload'); }
  };
  reader.readAsText(file);
}

function renderWeekBars(){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toLocaleDateString('en-CA');
    days.push({ key, label:d.toLocaleDateString('en-US',{weekday:'short'}).slice(0,2), mins:minutesOn(key), xp:(state.history[key]||{}).xp||0 });
  }
  const max = Math.max(15, ...days.map(d=>d.mins));
  return '<div class="week-bars">'+days.map((d,i)=>
    '<div class="week-bar-col" title="'+d.mins+' min, '+d.xp+' XP">'+
      '<span class="week-bar-val">'+(d.mins||'')+'</span>'+
      '<div class="week-bar'+(i===6?' today':'')+'" style="height:'+Math.max(4, Math.round(d.mins/max*80))+'px;'+(d.mins===0&&d.xp>0?'background:var(--gold-pale);height:8px;':'')+'"></div>'+
      '<span class="week-bar-label">'+d.label+'</span>'+
    '</div>').join('')+'</div>';
}

  const t = state.timer;
  if(t && t.active){
    const plan = currentPlan();
    const seg = plan.segs[t.segIdx], k = SEG_KINDS[seg.kind];
    const C = 2*Math.PI*88, frac = Math.min(1, Math.max(0, 1 - t.remaining/(seg.min*60)));
    return '<div class="card card-pad" style="margin-bottom:22px;border-color:var(--celadon);">'+
      '<div class="timer-hero">'+
        '<div class="timer-ring-wrap">'+
          '<svg viewBox="0 0 200 200"><circle class="timer-ring-bg" cx="100" cy="100" r="88"/><circle id="timer-ring-fg" class="timer-ring-fg" cx="100" cy="100" r="88" style="stroke-dasharray:'+C+';stroke-dashoffset:'+(C*(1-frac))+';"/></svg>'+
          '<div class="timer-ring-center"><div class="timer-time" data-timer="time">'+fmtTime(t.remaining)+'</div><div class="timer-seg-label">'+(t.running?k.label:'Paused')+'</div></div>'+
        '</div>'+

          '<div class="section-eyebrow">'+plan.name+' session \u00b7 '+plan.minutes+' min \u00b7 segment '+(t.segIdx+1)+' of '+plan.segs.length+'</div>'+

          '<p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:14px;">'+k.tip+'</p>'+
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">'+
            '<button class="btn btn-celadon" data-action="seg-go" data-kind="'+seg.kind+'">Go to '+k.label.toLowerCase()+'</button>'+
            '<button class="btn btn-outline" data-action="timer-toggle">'+icon(t.running?'pause':'play')+(t.running?' Pause':' Resume')+'</button>'+
            '<button class="btn btn-outline" data-action="timer-skip">'+icon('skip')+' Next</button>'+

        '</div>'+

    '</div>';

    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">'+icon('timer')+'<h3 style="font-size:17px;">Start today\u2019s session</h3></div>'+
    '<p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:16px;">Pick a length. The timer walks you through review, new material, listening, speaking, and writing in the right order.</p>'+
    '<div class="plan-grid" style="margin-bottom:16px;">'+SESSION_PLANS.map(p=>'<div class="plan-card'+(p.id===pick.id?' sel':'')+'" data-action="plan-pick" data-plan="'+p.id+'"><div class="plan-min">'+p.minutes+'</div><div class="plan-name">'+p.name+'</div></div>').join('')+'</div>'+

}

function videoPlayer(id, title){
  const loaded = view.videoLoaded===id;
  /* When loaded, the frame is left EMPTY on purpose: it is only a
     placeholder that reserves the 16:9 box, and the persistent player
     outside #app is positioned over it. See syncVideoHost(). */
  return '<div class="video-frame'+(loaded?' is-playing':'')+'"'+
      (loaded?' id="yt-slot" data-vid="'+id+'" data-title="'+escapeHtml(title||'Video')+'"':'')+'>'+
    (loaded
      ? '<div class="video-loading"><span class="video-spinner"></span><span>Loading player\u2026</span></div>'
      : '<img class="video-thumb" src="https://i.ytimg.com/vi/'+id+'/hqdefault.jpg" alt="" loading="lazy" onerror="this.style.display=\'none\'">'+
        '<button class="video-play" data-action="video-load" data-id="'+id+'" aria-label="Play video"><span>'+icon('play')+'</span></button>')+
  '</div>'+
  (isFileOrigin()
    ? '<div class="video-note">'+icon('question')+'<div><b>This page is open straight from a file.</b> YouTube will not play inside a page loaded with <span class="mono">file://</span>, so use Open on YouTube below \u2014 or serve the folder over <span class="mono">http://</span> (for example <span class="mono">npx http-server</span>) and the player will work in place.</div></div>'
    : '')+
  '<div class="video-bar">'+
    '<span class="video-hint">'+(isFileOrigin()?'Playback is blocked for local files.':'Not playing? Some lessons only allow playback on YouTube itself.')+'</span>'+
    '<a class="btn btn-outline btn-sm" href="'+ytWatchUrl(id)+'" target="_blank" rel="noopener noreferrer">Open on YouTube \u2197</a>'+
  '</div>';
}

  VIDEO_CURRICULUM.map(group=>

function drawHwGuide(show){

function mountHandwriting(){
  const g = document.getElementById('hw-guide'), ink = document.getElementById('hw-ink');
  if(!g || !ink) return;

  [g,ink].forEach(c=>{ c.width = size; c.height = size; });
  view.hw.checked = false;
  drawHwGuide(view.hw.mode==='trace');
  const ctx = ink.getContext && ink.getContext('2d'); if(!ctx) return;
  ctx.strokeStyle = cssVar('--ink', '#16262A'); ctx.lineWidth = Math.max(6, size/34); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let drawing = false;
  const pos = e=>{ const r = ink.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  ink.onpointerdown = e=>{ drawing = true; const [x,y] = pos(e); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+0.1,y+0.1); ctx.stroke(); try{ ink.setPointerCapture(e.pointerId); }catch(err){} };
  ink.onpointermove = e=>{ if(!drawing) return; const [x,y] = pos(e); ctx.lineTo(x,y); ctx.stroke(); };
  ink.onpointerup = ink.onpointerleave = ink.onpointercancel = ()=>{ drawing = false; };
}

async function toggleShadowRecord(){
  if(shRec && shRec.state==='recording'){ shRec.stop(); return; }
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)){ showToast('Recording unavailable','This browser cannot record audio.','speakerOff'); return; }
  try{
    shStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    shChunks = []; shRec = new MediaRecorder(shStream);
    shRec.ondataavailable = e=>{ if(e.data && e.data.size) shChunks.push(e.data); };
    shRec.onstop = ()=>{
      if(shUrl) URL.revokeObjectURL(shUrl);
      shUrl = URL.createObjectURL(new Blob(shChunks, { type: shRec.mimeType || 'audio/webm' }));
      if(shStream) shStream.getTracks().forEach(t=>t.stop());
      view.shRecording = false; render();
    };
    shRec.start(); view.shRecording = true; render();
    setTimeout(()=>{ if(shRec && shRec.state==='recording') shRec.stop(); }, 12000);
  }catch(e){ view.shRecording = false; render(); showToast('Microphone blocked','Allow microphone access to record yourself.','speakerOff'); }
}
function clearShadowRecording(){ if(shUrl){ try{ URL.revokeObjectURL(shUrl); }catch(e){} } shUrl = null; }

  '</div>'+
  '<div class="card card-pad" style="margin-bottom:18px;"><h3 style="font-size:14px;margin-bottom:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;">Glossary</h3><div class="glossary-grid">'+
    p.glossary.map(g=>'<div class="gloss-item" data-action="speak" data-text="'+g.kr+'" style="cursor:pointer;"><b class="kr">'+g.kr+'</b> \u00b7 '+g.en+'</div>').join('')+
  '</div></div>'+
  '<button class="btn '+(done?'btn-outline':'btn-celadon')+' btn-block" data-action="reading-complete" data-id="'+p.id+'">'+(done?icon('check')+' Completed':'Mark as read')+'</button>';
}

/* ============================================================
   V3 RENDER: PROGRESS
   ============================================================ */
function renderHeatmap(){
  const cells = []; const today = new Date();
  const start = new Date(); start.setDate(today.getDate()-7*17+1); start.setDate(start.getDate()-start.getDay());
  for(let d=new Date(start); d<=today; d.setDate(d.getDate()+1)){
    const key = d.toLocaleDateString('en-CA'), h = state.history[key]||{};
    const score = Math.floor((h.secs||0)/60) + (h.xp||0)/4;
    const lvl = score<=0?0:score<8?1:score<20?2:score<40?3:4;
    cells.push('<div class="hm-cell'+(lvl?' hm-'+lvl:'')+'" title="'+key+': '+Math.floor((h.secs||0)/60)+' min, '+(h.xp||0)+' XP"></div>');
  }
  return '<div class="heatmap">'+cells.join('')+'</div><div class="hm-legend">Less <span class="hm-cell"></span><span class="hm-cell hm-1"></span><span class="hm-cell hm-2"></span><span class="hm-cell hm-3"></span><span class="hm-cell hm-4"></span> More</div>';
}
function renderSettingsRows(){
  const s = state.settings, tc = themeChoice();
  return '<div class="settings-row"><span>Sound effects</span><button class="switch'+(s.sound?' on':'')+'" data-action="toggle-setting" data-key="sound" aria-label="Sound effects"></button></div>'+
         '<div class="settings-row"><span>Slow audio</span><button class="switch'+(s.slowAudio?' on':'')+'" data-action="toggle-setting" data-key="slowAudio" aria-label="Slow audio"></button></div>'+
         '<div class="settings-row"><span>Theme</span>'+
           '<div class="theme-seg" role="group" aria-label="Theme">'+
             THEME_CHOICES.map(c=>'<button class="theme-seg-btn'+(tc===c.id?' sel':'')+'" data-action="set-theme" data-theme="'+c.id+'" title="'+c.label+' theme" aria-label="'+c.label+' theme" aria-pressed="'+(tc===c.id)+'">'+icon(c.icon)+'</button>').join('')+
           '</div>'+
         '</div>';
}
function renderProgress(){
  const t = computeTotals(), lvl = levelFromXp(state.xp);
  let weekMin = 0; for(let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()-i); weekMin += minutesOn(d.toLocaleDateString('en-CA')); }
  const rows = [
    ['hangul','Alphabet',t.hangulDone,t.hangulTotal],['speaker','Pronunciation rules',t.pronDone,t.pronTotal],
    ['book','Vocabulary',t.vocabDone,t.vocabTotal],['chat','Phrases',t.phraseDone,t.phraseTotal],
    ['puzzle','Grammar lessons',t.grammarDone,t.grammarTotal],['puzzle','Irregular verbs',t.irrDone,t.irrTotal],
    ['openbook','Reading',t.readingDone,t.readingTotal],['keyboard','Typing',t.typingDone,t.typingTotal],
    ['video','Video lessons watched',state.videos.watched.length,VIDEO_CURRICULUM.reduce((s,g)=>s+g.items.length,0)],
  ];
  return ''+
  '<div class="section-head"><div class="section-eyebrow">Progress</div><h2 class="section-title">Your journey so far</h2><p class="section-desc">Level '+lvl.level+' \u00b7 '+state.xp+' total XP \u00b7 '+state.streak+'-day streak.</p></div>'+
  '<div class="grid grid-4" style="margin-bottom:22px;">'+
    [['Today',minutesOn(todayStr())+' min'],['This week',fmtHours(weekMin)],['All time',fmtHours(totalMinutes())],['Sessions',String(state.sessionsCompleted||0)]]
    .map(([l,v])=>'<div class="card stat-card" style="cursor:default;"><div class="stat-card-label">'+l+'</div><div class="stat-card-num">'+v+'</div></div>').join('')+
  '</div>'+
  '<div class="card card-pad" style="margin-bottom:22px;"><h3 style="font-size:15px;margin-bottom:12px;">Practice calendar</h3>'+renderHeatmap()+'</div>'+
  '<div class="card card-pad" style="margin-bottom:22px;">'+
    rows.map(([ic,label,done,total])=>{ const pct = total>0?Math.round(Math.min(done,total)/total*100):0;
      return '<div class="progress-row-item"><div class="pr-icon" style="background:var(--celadon-pale);color:var(--celadon-deep);">'+icon(ic)+'</div><div class="pr-main"><div class="pr-label-row"><b>'+label+'</b><span>'+Math.min(done,total)+' / '+total+'</span></div><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div></div></div>'; }).join('')+
  '</div>'+
  '<div class="card card-pad" style="margin-bottom:22px;">'+
    '<h3 style="font-size:15px;margin-bottom:14px;">Achievements ('+state.achievements.length+' / '+ACHIEVEMENTS.length+')</h3>'+
    '<div class="achv-grid">'+ACHIEVEMENTS.map(a=>{ const u = state.achievements.includes(a.id);
      return '<div class="achv-card'+(u?'':' locked')+'"><div class="achv-badge">'+icon(a.icon)+'</div><div class="achv-name">'+a.name+'</div><div class="achv-desc">'+a.desc+'</div></div>'; }).join('')+'</div>'+
  '</div>'+
  '<div class="grid grid-2">'+
    '<div class="card card-pad"><h3 style="font-size:15px;margin-bottom:12px;">Settings</h3><div style="display:flex;flex-direction:column;gap:12px;">'+renderSettingsRows()+'</div></div>'+
    '<div class="card card-pad"><h3 style="font-size:15px;margin-bottom:6px;">Back up your progress</h3><p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;line-height:1.55;">Progress lives in this browser. Clearing browser data erases it, so save a backup now and then.</p>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-outline btn-sm" data-action="backup-export">'+icon('download')+' Save backup</button><button class="btn btn-outline btn-sm" data-action="backup-import">'+icon('upload')+' Restore</button><input type="file" id="import-file" accept="application/json,.json" style="display:none;"></div></div>'+
  '</div>';
}

/* ============================================================
   V3 WRITING KEYBOARD (reuses the typing composer)
   ============================================================ */
let writeKeydownHandler = null;
function updateWriteDisplay(){
  const el = document.getElementById('write-output');
  if(el) el.innerHTML = escapeHtml(composerDisplay())+'<span class="caret"></span>';
}
function mountWriting(){
  const tab = view.writeTab || 'handwriting';
  if(tab==='handwriting'){ mountHandwriting(); return; }
  if(tab==='translate' && view.tr && view.tr.checked) return;
  if(!builtinInput()) return;
  writeKeydownHandler = function(e){
    if(e.target && (e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA')) return;
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.key==='Enter'){ e.preventDefault(); const b = document.querySelector('[data-action="write-check"]'); if(b) b.click(); return; }
    if(e.key==='Backspace'){ e.preventDefault(); composerBackspace(); updateWriteDisplay(); return; }
    if(e.key===' '){ e.preventDefault(); composerSpace(); updateWriteDisplay(); return; }
    if(e.key.length===1 && /[a-zA-Z]/.test(e.key)){
      const lower = e.key.toLowerCase();
      const j = e.shiftKey ? (SHIFT_KEY_TO_JAMO[lower]||KEY_TO_JAMO[lower]) : KEY_TO_JAMO[lower];
      if(j){ e.preventDefault(); composerKeyPress(j); updateWriteDisplay(); }
    }
  };
  window.addEventListener('keydown', writeKeydownHandler);
}
function unmountWriting(){ if(writeKeydownHandler){ window.removeEventListener('keydown', writeKeydownHandler); writeKeydownHandler = null; } }

/* ============================================================
   V3 SMOOTH FLASHCARD FLIP (capture phase: flips in place so the
   CSS 3D transition actually animates instead of re-rendering)
   ============================================================ */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action="flash-flip"]');
  if(!el) return;
  e.stopPropagation();
  view.flashFlipped = !view.flashFlipped;
  el.classList.toggle('flipped', view.flashFlipped);
}, true);

/* ============================================================
   V3 EVENT DELEGATION
   ============================================================ */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');
  switch(action){
    /* timer */
    case 'plan-pick': view.planPick = el.getAttribute('data-plan'); render(); break;
    case 'session-start': startSession(el.getAttribute('data-plan')); break;
    case 'timer-toggle': e.stopPropagation(); toggleTimer(); break;
    case 'timer-skip': e.stopPropagation(); advanceSegment(true); break;
    case 'timer-end': endSession(); showToast('Session ended', minutesOn(todayStr())+' minutes logged today.', 'timer'); break;
    case 'seg-go': goToSegment(el.getAttribute('data-kind')); break;

    /* today */
    case 'wotd-add': {
      const key = vocabKey(el.getAttribute('data-cat'), el.getAttribute('data-idx'));
      if(!state.vocab.known[key]){ state.vocab.known[key] = true; addXp(3); bumpCounter('learned'); }
      render(); break;
    }

    /* settings */
    case 'toggle-setting': { const k = el.getAttribute('data-key'); state.settings[k] = !state.settings[k]; persistState(); render(); if(k==='sound' && state.settings.sound) sfx('correct'); break; }
    case 'set-theme': setTheme(el.getAttribute('data-theme')); break;
    case 'speak-slow': speak(el.getAttribute('data-text'), 0.62); break;

    /* videos */
    case 'video-load': view.videoLoaded = el.getAttribute('data-id'); render(); break;
    case 'video-select': view.videoId = el.getAttribute('data-id'); view.videoLoaded = view.videoId; render(); window.scrollTo({top:0, behavior:'smooth'}); break;
    case 'video-watched': {
      const key = el.getAttribute('data-key');
      if(!state.videos.watched.includes(key)){ state.videos.watched.push(key); addXp(10); bumpCounter('videos'); }
      else { state.videos.watched = state.videos.watched.filter(k=>k!==key); persistState(); }
      render(); break;
    }
    case 'video-add': {
      const id = ytIdFromUrl(view.videoUrl);
      if(!id){ showToast('Not a YouTube link', 'Paste a full youtube.com or youtu.be link.', 'video'); break; }
      if(!state.videos.custom.some(c=>c.id===id)) state.videos.custom.unshift({ id, title:'Video '+id, added:todayStr() });
      view.videoUrl = ''; view.videoId = id; view.videoLoaded = id;
      persistState(); render(); window.scrollTo({top:0, behavior:'smooth'});
      showToast('Video added', 'It is saved to your list.', 'video'); break;
    }
    case 'video-remove': { const id = el.getAttribute('data-id'); state.videos.custom = state.videos.custom.filter(c=>c.id!==id); if(view.videoId===id){ view.videoId=null; view.videoLoaded=null; } persistState(); render(); break; }

    /* writing */
    case 'write-tab': view.writeTab = el.getAttribute('data-tab'); typingComposer = {committed:'',cur:null}; render(); break;
    case 'input-mode': state.settings.inputMode = builtinInput() ? 'own' : 'builtin'; typingComposer = {committed:'',cur:null}; persistState(); render(); break;
    case 'kp-key': composerKeyPress(el.getAttribute('data-jamo')); if(view.kpShift){ view.kpShift=false; render(); } else updateWriteDisplay(); break;
    case 'kp-shift': view.kpShift = !view.kpShift; render(); break;
    case 'kp-back': composerBackspace(); updateWriteDisplay(); break;
    case 'kp-space': composerSpace(); updateWriteDisplay(); break;
    case 'hw-mode': view.hw.mode = el.getAttribute('data-mode'); render(); break;
    case 'hw-clear': { const c = document.getElementById('hw-ink'); const x = c && c.getContext && c.getContext('2d'); if(x) x.clearRect(0,0,c.width,c.height); view.hw.checked=false; drawHwGuide(view.hw.mode==='trace'); break; }
    case 'hw-check': { view.hw.checked = true; drawHwGuide(true); const r = document.getElementById('hw-rate'); if(r) r.style.display='flex'; speak(view.hw.word.kr); break; }
    case 'hw-rate': { addXp(el.getAttribute('data-good')==='1'?4:2); bumpCounter('writing'); const pool = hwPool(); view.hw = { word: pool[Math.floor(Math.random()*pool.length)], mode:view.hw.mode }; render(); break; }
    case 'hw-next': { const pool = hwPool(); view.hw = { word: pool[Math.floor(Math.random()*pool.length)], mode:view.hw.mode }; render(); break; }
    case 'tr-level': view.tr = { level: el.getAttribute('data-level') }; startTranslate(); render(); break;
    case 'tr-clear': typingComposer = {committed:'',cur:null}; view.trText=''; render(); break;
    case 'tr-next': startTranslate(); render(); break;
    case 'write-check': {
      if(!view.tr || view.tr.checked) break;
      const ans = getWriteInput('trText');
      view.tr.answer = ans; view.tr.checked = true;
      view.tr.result = normKr(ans) && normKr(ans)===normKr(view.tr.item.kr) ? 'correct' : 'wrong';
      if(view.tr.result==='correct') addXp(5);
      bumpCounter('writing'); render(); speak(view.tr.item.kr); break;
    }
    case 'tr-override': view.tr.result = 'correct'; addXp(5); render(); break;
    case 'journal-save': {
      const text = getWriteInput('journalText').trim();
      if(normKr(text).length<2){ showToast('Write a little more', 'Even one short sentence counts.', 'pen'); break; }
      state.journal.push({ ts:Date.now(), date:todayStr(), prompt:journalPrompt().en, text });
      typingComposer = {committed:'',cur:null}; view.journalText = '';
      addXp(15); bumpCounter('writing', 3); render();
      showToast('Entry saved', 'Nice. Writing is where it sticks.', 'pen'); break;
    }
    case 'journal-delete': { const ts = Number(el.getAttribute('data-ts')); state.journal = state.journal.filter(j=>j.ts!==ts); persistState(); render(); break; }

    /* pronunciation */
    case 'pron-tab': view.pronTab = el.getAttribute('data-tab'); view.pronRule = null; render(); break;
    case 'mp-answer': {
      const m = view.mp; if(m.answered) break;
      m.selected = el.getAttribute('data-kr'); m.answered = true; m.asked++;
      if(m.selected===m.target.kr){ m.correct++; addXp(3); }
      render(); break;
    }
    case 'mp-next': startMinimalPair(); render(); setTimeout(()=>{ if(view.mp) speak(view.mp.target.kr); }, 250); break;
    case 'shadow-rec': toggleShadowRecord(); break;
    case 'shadow-rate': {
      addXp(el.getAttribute('data-good')==='1'?4:2); bumpCounter('speaking');
      state.stats.shadowed = (state.stats.shadowed||0)+1;
      clearShadowRecording(); view.shIdx = (view.shIdx||0)+1; render(); break;
    }
    case 'shadow-next': clearShadowRecording(); view.shIdx = (view.shIdx||0)+1; render(); break;

    /* reading */
    case 'line-play': speak(el.getAttribute('data-text')); bumpCounter('reading', 0.2); break;
    case 'read-all': readPlayToken++; playReadingFrom(0, readPlayToken); bumpCounter('reading', 0.2); break;

    /* backup */
    case 'backup-export': exportProgress(); break;
    case 'backup-import': { const f = document.getElementById('import-file'); if(f) f.click(); break; }
  }
});

/* passive quest counters for actions handled by the older dispatchers */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.getAttribute('data-action');
  const map = { 'srs-grade':'reviews', 'dictation-answer':'listening', 'mp-answer':'listening', 'number-answer':'drills', 'conj-answer':'drills', 'sentence-check':'drills', 'quiz-answer':'drills' };
  if(map[a]) bumpCounter(map[a]);
  if(a==='vocab-toggle-known' && state.vocab.known[vocabKey(el.getAttribute('data-cat'), el.getAttribute('data-idx'))]) bumpCounter('learned');
  if(a==='phrase-toggle-known' && state.phrases.known[phraseKey(el.getAttribute('data-scen'), el.getAttribute('data-idx'))]) bumpCounter('learned');
  if(a==='flash-mark' && el.getAttribute('data-known')==='1') bumpCounter('learned');
  if(a==='reading-complete' && state.reading.completed.includes(el.getAttribute('data-id'))) bumpCounter('reading');
});

/* text inputs keep their value across re-renders */
document.addEventListener('input', function(e){
  const b = e.target && e.target.getAttribute && e.target.getAttribute('data-bind');
  if(b) view[b] = e.target.value;
});
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target && e.target.id==='trText-input'){ e.preventDefault(); const b = document.querySelector('[data-action="write-check"]'); if(b) b.click(); }
});
document.addEventListener('change', function(e){
  if(e.target && e.target.id==='import-file' && e.target.files && e.target.files[0]) importProgress(e.target.files[0]);
});

/* ============================================================
   AFTER-RENDER HOOKS (DOM-dependent mounting)
   ============================================================ */
function afterRender(){
  unmountTyping();
  unmountWriting();
  if(currentSection==='hangul' && view.hangulDetail){ afterRenderHangulDetail(); }
  if(currentSection==='typing'){ mountTyping(); }
  if(currentSection==='writing'){ mountWriting(); }
  if(state.timer && state.timer.active) updateTimerDom();
  syncVideoHost();
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  primeVoices();
  await loadState();
  applyTheme();
  touchStreak();
  ensureDailyGoal();
  if(state.timer && state.timer.active){ state.timer.running = false; state.timer.lastTick = Date.now(); }
  setInterval(timerTick, 1000);
  await persistState();
  render();
})();
</script>
